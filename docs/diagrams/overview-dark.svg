<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1000 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="overview-dark-title overview-dark-desc" id="overview-dark-root">
<title id="overview-dark-title">MIZAN directs, the language model speaks</title>
<desc id="overview-dark-desc">Architecture: a request reaches Tadbir, which understands it with Fahm, runs every tool through one gate into the sandbox or memory, asks the language model only for words or code, and sends unverified answers through Sidq, Isnad and Ahl al-Dhikr before they stream back.</desc>
