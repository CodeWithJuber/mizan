<rect x="530" y="477" width="88" height="12" rx="2" fill="#0f172a"/><text x="574" y="486" fill="#94a3b8" font-size="8" font-family="'IBM Plex Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">VERIFIED ONLY</text>
<rect x="338.158" y="415.5" width="48" height="12" rx="2" fill="#0f172a"/><text x="362.158" y="424.5" fill="#94a3b8" font-size="8" font-family="'IBM Plex Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">RECORD</text>
<rect x="440" y="88" width="160" height="64" rx="6" fill="#0f172a"/><rect x="440" y="88" width="160" height="64" rx="6" fill="#0f172a" stroke="#f1f5f9" stroke-width="1"/><text x="520.0" y="116" fill="#f1f5f9" font-size="12" font-weight="600" font-family="'DM Sans', system-ui, sans-serif" text-anchor="middle">Understand</text><text x="520.0" y="132" fill="#cbd5e1" font-size="9" font-family="'IBM Plex Mono', ui-monospace, monospace" text-anchor="middle">Fahm + user overlay</text>
<rect x="648" y="208" width="160" height="64" rx="6" fill="#0f172a"/><rect x="648" y="208" width="160" height="64" rx="6" fill="#0f172a" stroke="#f1f5f9" stroke-width="1"/><text x="728.0" y="236" fill="#f1f5f9" font-size="12" font-weight="600" font-family="'DM Sans', system-ui, sans-serif" text-anchor="middle">Act</text><text x="728.0" y="252" fill="#cbd5e1" font-size="9" font-family="'IBM Plex Mono', ui-monospace, monospace" text-anchor="middle">recipe runs tools</text>
<rect x="648" y="448" width="160" height="64" rx="6" fill="#0f172a"/><rect x="648" y="448" width="160" height="64" rx="6" fill="#d4af37" stroke="#d4af37" stroke-width="1" fill-opacity="0.14"/><text x="728.0" y="476" fill="#d4af37" font-size="12" font-weight="600" font-family="'DM Sans', system-ui, sans-serif" text-anchor="middle">Verify</text><text x="728.0" y="492" fill="#cbd5e1" font-size="9" font-family="'IBM Plex Mono', ui-monospace, monospace" text-anchor="middle">Tathabbut, Sidq</text>
<rect x="440" y="568" width="160" height="64" rx="6" fill="#0f172a"/><rect x="440" y="568" width="160" height="64" rx="6" fill="#0f172a" stroke="#f1f5f9" stroke-width="1"/><text x="520.0" y="596" fill="#f1f5f9" font-size="12" font-weight="600" font-family="'DM Sans', system-ui, sans-serif" text-anchor="middle">Keep</text><text x="520.0" y="612" fill="#cbd5e1" font-size="9" font-family="'IBM Plex Mono', ui-monospace, monospace" text-anchor="middle">Hifz, Qasd, Tajriba</text>
<rect x="232" y="448" width="160" height="64" rx="6" fill="#0f172a"/><rect x="232" y="448" width="160" height="64" rx="6" fill="#0f172a" stroke="#f1f5f9" stroke-width="1"/><text x="312.0" y="476" fill="#f1f5f9" font-size="12" font-weight="600" font-family="'DM Sans', system-ui, sans-serif" text-anchor="middle">Reuse</text><text x="312.0" y="492" fill="#cbd5e1" font-size="9" font-family="'IBM Plex Mono', ui-monospace, monospace" text-anchor="middle">no model call</text>
<rect x="232" y="208" width="160" height="64" rx="6" fill="#0f172a"/><rect x="232" y="208" width="160" height="64" rx="6" fill="#0f172a" stroke="#f1f5f9" stroke-width="1"/><text x="312.0" y="236" fill="#f1f5f9" font-size="12" font-weight="600" font-family="'DM Sans', system-ui, sans-serif" text-anchor="middle">Re-check</text><text x="312.0" y="252" fill="#cbd5e1" font-size="9" font-family="'IBM Plex Mono', ui-monospace, monospace" text-anchor="middle">Muhasaba, daily</text>
<rect x="420" y="308" width="200" height="104" rx="8" fill="#f1f5f9"/><text x="520" y="356" fill="#0f172a" font-size="13" font-weight="600" font-family="'DM Sans', system-ui, sans-serif" text-anchor="middle">Learned state</text><text x="520" y="374" fill="#0f172a" font-size="9" font-family="'IBM Plex Mono', ui-monospace, monospace" text-anchor="middle" opacity="0.8">per user, no weights</text>
<text x="40" y="732" fill="#cbd5e1" font-size="8" font-family="'IBM Plex Mono', ui-monospace, monospace" letter-spacing="0.18em">FOCAL STATION</text><text x="160" y="732" fill="#cbd5e1" font-size="9" font-family="'DM Sans', system-ui, sans-serif" font-style="italic">Only what was verified is kept; a stateless chat or a test writes nothing, and Mahw erases what a chat taught.</text>
</svg>
