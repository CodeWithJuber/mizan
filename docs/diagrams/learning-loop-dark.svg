<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1040 760" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="learning-loop-dark-title learning-loop-dark-desc" id="learning-loop-dark-root">
<title id="learning-loop-dark-title">How MIZAN learns: verified outcomes only</title>
<desc id="learning-loop-dark-desc">Loop of six stations, understand, act, verify, keep, reuse and re-check, around a hub of per-user learned state; keep and reuse write back to it.</desc>
<defs>
      <style>#learning-loop-dark-root { font-family: 'DM Sans', system-ui, sans-serif; color: #f1f5f9; }
      #learning-loop-dark-root .diagram-container { width: 100%; overflow-x: auto; }</style><pattern id="learning-loop-dark-dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.9" fill="#f1f5f9" fill-opacity="0.08"/></pattern><marker id="learning-loop-dark-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#cbd5e1"/></marker><marker id="learning-loop-dark-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#d4af37"/></marker><marker id="learning-loop-dark-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#93c5fd"/></marker><marker id="learning-loop-dark-arrow-soft" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#94a3b8"/></marker></defs>
