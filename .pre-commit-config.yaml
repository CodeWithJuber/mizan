repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.2
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: detect-private-key

  # The workflows run on the self-hosted runner and use nothing GitHub bills for (docs/ci-artifacts.md).
  - repo: local
    hooks:
      - id: no-github-billing
        name: no GitHub-billed workflow features
        entry: bash scripts/ci/no-github-billing.sh
        language: system
        files: ^\.github/.*\.ya?ml$
