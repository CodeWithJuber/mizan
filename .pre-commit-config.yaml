repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.2
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: detect-private-key

  # The workflows keep to the public-repository rules: standard hosted runners, actions pinned to
  # a commit, no pull request code with secrets (docs/ci-artifacts.md).
  - repo: local
    hooks:
      - id: public-repo-guard
        name: workflows keep to the public-repository rules
        entry: bash scripts/ci/public-repo-guard.sh
        language: system
        files: ^\.github/.*\.ya?ml$
