[build-system]
requires = ["hatchling>=1.32.4,<2"]
build-backend = "hatchling.build"

[project]
name = "pymizan"
version = "3.3.0"
description = "Agentic Personal AI - Quranic Cognitive Architecture for human-like reasoning"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [
    { name = "MIZAN Contributors" },
]
keywords = [
    "ai", "agent", "personal-ai", "agentic", "agi",
    "quranic", "cognitive-architecture", "llm", "assistant",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Framework :: FastAPI",
]
dependencies = [
    "fastapi>=0.142.2,<0.143",
    "uvicorn[standard]>=0.54.0,<0.55",
    "websockets>=17.1,<18",
    "pydantic>=2.13.5,<3",
    "pydantic-settings>=2.15.0,<3",
    "anthropic>=1.11.0,<2",
    "openai>=3.22.1,<4",
    "httpx>=0.28.1,<0.29",
    "python-multipart>=0.0.32,<0.1",
    "aiofiles>=25.1.0,<26",
    "aiosqlite>=0.22.1,<0.23",
    "python-dotenv>=1.2.4,<2",
    "PyJWT>=2.15.1,<3",
    "bcrypt>=5.0.0,<6",
    "cryptography>=50.0.2,<51",
    "croniter>=6.2.4,<7",
    "click>=8.5.0,<9",
    "rich>=15.0.0,<16",
    "Pillow>=12.3.0,<13",
]

[project.optional-dependencies]
knowledge = [
    "pymupdf>=1.28.2,<2",
    "youtube-transcript-api>=1.2.4,<2",
]
all = [
    "chromadb>=0.5.0",
    "python-telegram-bot>=21.5",
    "discord.py>=2.3.2",
    "slack-bolt>=1.20.0",
    "elevenlabs>=1.5.0",
]
channels = [
    "python-telegram-bot>=21.5",
    "discord.py>=2.3.2",
    "slack-bolt>=1.20.0",
]
vector = [
    "chromadb>=0.5.0",
]
voice = [
    "elevenlabs>=1.5.0",
]
ml = [
    "torch>=2.10.0,<2.15",
    "numpy>=2.4.6,<2.5; python_version < '3.12'",
    "numpy>=2.5.3,<3; python_version >= '3.12'",
    "tqdm>=4.66.0",
    "safetensors>=0.4.0",
    "epitran>=1.25.0",
    "panphon>=0.20.0",
    "datasets>=2.16.0",
    "huggingface-hub>=0.20.0",
]
nlp = [
    # Native inference deps for mizan.nlp (backend/nlp) — CPU-friendly WSD.
    # Phase 1: sklearn per-lemma classifiers (joblib artifact). Install with: pip install "pymizan[nlp]"
    "scikit-learn>=1.9.1,<1.10",
    "joblib>=1.6.0,<2",
    "numpy>=2.4.6,<2.5; python_version < '3.12'",
    "numpy>=2.5.3,<3; python_version >= '3.12'",
]
dev = [
    "pytest>=9.1.1,<10",
    "pytest-asyncio>=1.4.0,<2",
    "pytest-cov>=7.1.0,<8",
    "ruff>=0.16.9,<0.17",
    "pre-commit>=4.6.2,<5",
    "mypy>=2.3.1,<3",
]

[project.urls]
Homepage = "https://github.com/CodeWithJuber/mizan"
Documentation = "https://github.com/CodeWithJuber/mizan/tree/main/docs"
Repository = "https://github.com/CodeWithJuber/mizan"
Issues = "https://github.com/CodeWithJuber/mizan/issues"

[project.scripts]
mizan = "backend.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["backend", "nlp", "ruh_model"]
exclude = [
    "ruh_model/checkpoints/**",
    "ruh_model/tests/**",
    "ruh_model/data/training/**",
    "ruh_model/data/processed/**",
    "ruh_model/data/downloads/**",
    "**/*.pt",
    "**/*.safetensors",
    "**/*.ckpt",
    "ruh_model/data/**/*.jsonl",
    "**/*.parquet",
    "**/*.arrow",
    "**/*.db",
    "**/*.sqlite*",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["backend"]

[tool.ruff.lint.isort]
known-first-party = ["nlp"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "S",   # flake8-bandit (security)
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "S101",  # assert usage (ok in tests)
    "S104",  # hardcoded bind all interfaces (intentional for dev servers)
    "S105",  # hardcoded password (false positives on field names)
    "S108",  # hardcoded temp file (we use /tmp intentionally)
    "S110",  # try-except-pass (used for optional feature detection)
    "S112",  # try-except-continue (used for resilient iteration)
    "S311",  # non-cryptographic random (used for non-security purposes)
    "S602",  # subprocess shell=True (validated through Wali security layer)
    "S603",  # subprocess call (we validate commands)
    "S607",  # start process with partial path
    "B008",  # function call in default argument (used by FastAPI Depends())
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S106", "S108"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short"

[tool.mypy]
python_version = "3.12"
explicit_package_bases = true
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
