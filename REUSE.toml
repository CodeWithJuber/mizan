# Copyright and licence of every file (https://reuse.software, `reuse lint`). MIZAN is
# AGPL-3.0-only; the annotations after the first name what is under another licence. A later
# annotation wins for the paths it matches. Sources and changes are in NOTICE and in each data
# directory's LICENSES.md.
version = 1
SPDX-PackageName = "MIZAN"
SPDX-PackageSupplier = "Juber Shaikh (Hostlelo)"
SPDX-PackageDownloadLocation = "https://github.com/CodeWithJuber/mizan"

[[annotations]]
path = "**"
SPDX-FileCopyrightText = "2026 Juber Shaikh (Hostlelo)"
SPDX-License-Identifier = "AGPL-3.0-only"

# Bayan, the tokenizer package published on its own (vendored from ruh_model/tokenizer/).
[[annotations]]
path = "packages/bayan/**"
SPDX-FileCopyrightText = "2026 MIZAN Contributors"
SPDX-License-Identifier = "MIT"

# Components generated from shadcn/ui and adapted.
[[annotations]]
path = "frontend/src/components/ui/**"
SPDX-FileCopyrightText = ["2023 shadcn", "2026 Juber Shaikh (Hostlelo)"]
SPDX-License-Identifier = "MIT"

# The sense-model artifacts declare Apache-2.0 in their manifests (nlp/artifact.py).
[[annotations]]
path = "nlp/artifacts/*/**"
SPDX-FileCopyrightText = "2026 Juber Shaikh (Hostlelo)"
SPDX-License-Identifier = "Apache-2.0"

