# MIZAN (ميزان) - Full Stack Deployment
# "And the heaven He raised and imposed the balance (Mizan)" - Quran 55:7

services:
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: mizan-backend
    restart: unless-stopped
    stop_grace_period: 30s
    ports:
      - "8000:8000"
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - MIZAN_OPENROUTER_FALLBACKS=${MIZAN_OPENROUTER_FALLBACKS:-auto}
      - MIZAN_PUBLIC_URL=${MIZAN_PUBLIC_URL:-}
      - MIZAN_MCP_HOST_STDIO=${MIZAN_MCP_HOST_STDIO:-admin}
      - MIZAN_MCP_ALLOW_PRIVATE_HOSTS=${MIZAN_MCP_ALLOW_PRIVATE_HOSTS:-}
      - MIZAN_PROJECT_SKILLS=${MIZAN_PROJECT_SKILLS:-true}
      - OLLAMA_URL=${OLLAMA_URL:-http://ollama:11434}
      - DEFAULT_MODEL=${DEFAULT_MODEL:-}
      - LLM_PROVIDER=${LLM_PROVIDER:-auto}
      - MIZAN_OWNED_ONLY=${MIZAN_OWNED_ONLY:-false}
      - MIZAN_OWNED_DB=/data/mizan_owned.sqlite3
      - MIZAN_REPLY_CHECKPOINT=${MIZAN_REPLY_CHECKPOINT:-}
      - MIZAN_OWNED_LEARNING_DIR=${MIZAN_OWNED_LEARNING_DIR:-/data/owned_learning}
      - MIZAN_OWNED_LEARNING_AUTORUN=${MIZAN_OWNED_LEARNING_AUTORUN:-true}
      - MIZAN_CHAT_MAX_OUTPUT_TOKENS=${MIZAN_CHAT_MAX_OUTPUT_TOKENS:-}
      - MIZAN_CHAT_EFFORT=${MIZAN_CHAT_EFFORT:-high}
      - MIZAN_VECTOR_URL=${MIZAN_VECTOR_URL:-}  # http://chroma:8000 with the vector profile
      - MIZAN_MEMORY_MAINTENANCE=${MIZAN_MEMORY_MAINTENANCE:-true}
      - MIZAN_CHAT_MAX_STEPS=${MIZAN_CHAT_MAX_STEPS:-100}
      - MIZAN_CHAT_MAX_CONTINUATIONS=${MIZAN_CHAT_MAX_CONTINUATIONS:-20}
      - MIZAN_CONTEXT_HISTORY_TOKENS=${MIZAN_CONTEXT_HISTORY_TOKENS:-150000}
      - MIZAN_SUPPORT_MODEL=${MIZAN_SUPPORT_MODEL:-}
      - MIZAN_RESEARCH_DIR=/data/research
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY environment variable is required}
      - DB_PATH=/data/mizan_memory.db
      - ALLOWED_ORIGINS=http://localhost:3100,http://localhost:3000,http://localhost:5173
      - LINODE_API_TOKEN=${LINODE_API_TOKEN:-}
      - RUH_ENABLED=${RUH_ENABLED:-false}
      - RUH_MODEL_PATH=${RUH_MODEL_PATH:-}
      - MIZAN_NLP_NATIVE_WSD=${MIZAN_NLP_NATIVE_WSD:-1}
      - RUNPOD_API_KEY=${RUNPOD_API_KEY:-}
      - RUNPOD_API_TOKEN=${RUNPOD_API_TOKEN:-}
      - RUNPOD_ENDPOINT_ID=${RUNPOD_ENDPOINT_ID:-}
      - MINIMIND_ENDPOINT_ID=${MINIMIND_ENDPOINT_ID:-}
      - MIZAN_HYBRID_ENABLED=${MIZAN_HYBRID_ENABLED:-false}
      - MIZAN_BASE_CONTEXT_WINDOW=${MIZAN_BASE_CONTEXT_WINDOW:-32768}
      - MIZAN_BASE_PROVIDER=${MIZAN_BASE_PROVIDER:-openai-compatible}
      - MIZAN_BASE_MODEL=${MIZAN_BASE_MODEL:-Qwen/Qwen3-4B-Instruct-2507}
      - MIZAN_BASE_REVISION=${MIZAN_BASE_REVISION:-cdbee75f17c01a7cc42f958dc650907174af0554}
      - MIZAN_BASE_URL=${MIZAN_BASE_URL:-}
      - MIZAN_BASE_API_KEY=${MIZAN_BASE_API_KEY:-}
      - MIZAN_SOURCE_REGISTRY=${MIZAN_SOURCE_REGISTRY:-}
      - MIZAN_NLP_ADVISORY=${MIZAN_NLP_ADVISORY:-true}
      - MIZAN_TARGET_LANGUAGE=${MIZAN_TARGET_LANGUAGE:-any}
      - MIZAN_GATE_MAX_RETRIES=${MIZAN_GATE_MAX_RETRIES:-1}
      - MIZAN_RETRY_MAX_TOKENS=${MIZAN_RETRY_MAX_TOKENS:-4096}
      - MIZAN_AUDIT_LOG=${MIZAN_AUDIT_LOG:-}
    volumes:
      - mizan-data:/data
      - mizan-plugins:/app/plugins
      - ./backend:/app
      - ./nlp:/app/nlp
      - ./ruh_model:/app/ruh_model
      - ./mizan_reply:/app/mizan_reply:ro
      - ./mizan_research:/app/mizan_research:ro
      - ./research/registry/runtime_sources.json:/app/research/registry/runtime_sources.json:ro
    networks:
      - mizan-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/Dockerfile.frontend
    container_name: mizan-frontend
    restart: unless-stopped
    stop_grace_period: 10s
    ports:
      - "3100:3000"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - mizan-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Optional: Local LLM via Ollama
  ollama:
    image: ollama/ollama:0.40.11
    container_name: mizan-ollama
    restart: unless-stopped
    stop_grace_period: 15s
    volumes:
      - ollama-data:/root/.ollama
    networks:
      - mizan-net
    profiles:
      - ollama
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Optional: Vector database for semantic search
  chroma:
    image: chromadb/chroma:1.5.9
    container_name: mizan-chroma
    restart: unless-stopped
    stop_grace_period: 15s
    ports:
      - "8100:8000"
    volumes:
      - chroma-data:/data  # Chroma 1.x persists under /data
    networks:
      - mizan-net
    profiles:
      - vector
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/heartbeat"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  mizan-net:
    driver: bridge

volumes:
  mizan-data:
  mizan-plugins:
  ollama-data:
  chroma-data:
