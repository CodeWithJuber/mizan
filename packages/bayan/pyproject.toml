[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
# NOTE: the bare "bayan" name is taken on PyPI by an unrelated project
# (a weblog scraper, v1.0.0). Distribution name is "bayan-tokenizer";
# the import name stays `bayan`.
name = "bayan-tokenizer"
version = "0.1.0"
description = "Bayan — morphological, root-cognizant tokenizer: Arabic words as (root, pattern) pairs, zero dependencies"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [
    { name = "MIZAN Contributors" },
]
keywords = [
    "arabic", "nlp", "tokenizer", "morphology", "root",
    "quranic", "linguistics",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/CodeWithJuber/mizan"
Source = "https://github.com/CodeWithJuber/mizan/tree/main/packages/bayan"
Documentation = "https://github.com/CodeWithJuber/mizan/tree/main/packages/bayan#readme"
Issues = "https://github.com/CodeWithJuber/mizan/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/bayan"]

# NOTE: no [tool.hatch.build.targets.sdist] override — the default sdist
# keeps the src/ layout, so a wheel built from the sdist resolves
# "src/bayan" correctly. Overriding sdist `packages` rebases the tree and
# produces an EMPTY wheel when built from the sdist (seen 2026-09-29).

[tool.ruff]
line-length = 88
target-version = "py39"
# src/bayan/_tok/ is generated by scripts/sync_vendor.py — it is linted
# upstream in the monorepo; reformatting it here would hide drift.
exclude = ["src/bayan/_tok"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
