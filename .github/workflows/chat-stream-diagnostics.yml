name: Inspect Interrupted QA Chat Stream

on:
  push:
    branches: [ops/chat-stream-diagnostics-20261026]

permissions:
  contents: read

concurrency:
  group: mizan-production
  cancel-in-progress: false

jobs:
  inspect:
    if: github.event_name == 'push' && github.repository == 'CodeWithJuber/mizan' && github.ref == 'refs/heads/ops/chat-stream-diagnostics-20261026'
    runs-on: [self-hosted, linux, x64, mizan]
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Validate read-only diagnostic syntax
        run: python3 -m py_compile scripts/chat_stream_diagnostics.py
      - name: Install SSH client
        run: command -v sshpass >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq sshpass)
      - name: Inspect fixed QA time window without changing services or data
        env:
          SSH_HOST: ${{ secrets.SSH_COMPUTING_HOST || vars.SSH_COMPUTING_HOST }}
          SSH_USER: ${{ secrets.SSH_COMPUTING_HOST_USER || vars.SSH_COMPUTING_HOST_USER }}
          SSHPASS: ${{ secrets.SSH_COMPUTING_HOST_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$SSH_HOST" && test -n "$SSH_USER" && test -n "$SSHPASS"
          test -s deploy/known_hosts
          ssh_options=(-o StrictHostKeyChecking=yes -o UserKnownHostsFile="$PWD/deploy/known_hosts" -o ConnectTimeout=15)
          remote_dir=$(sshpass -e ssh "${ssh_options[@]}" "$SSH_USER@$SSH_HOST" 'umask 077; test -d /var/lib/mizan-deploy && mktemp -d /var/lib/mizan-deploy/chat-diagnostics.XXXXXXXX')
          [[ "$remote_dir" =~ ^/var/lib/mizan-deploy/chat-diagnostics\.[A-Za-z0-9]{8}$ ]]
          trap 'sshpass -e ssh "${ssh_options[@]}" "$SSH_USER@$SSH_HOST" "rm -f '\''$remote_dir/chat_stream_diagnostics.py'\'' && rmdir '\''$remote_dir'\''" || true' EXIT
          sshpass -e scp "${ssh_options[@]}" scripts/chat_stream_diagnostics.py "$SSH_USER@$SSH_HOST:$remote_dir/"
          sshpass -e ssh "${ssh_options[@]}" "$SSH_USER@$SSH_HOST" "test -f /var/lib/mizan-deploy/deploy.lock && flock -s -w 30 /var/lib/mizan-deploy/deploy.lock timeout 240s python3 '$remote_dir/chat_stream_diagnostics.py'"
