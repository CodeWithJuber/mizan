name: Inspect Interrupted QA Chat Stream

# A completed, read-only production operation, kept as a record. It runs only on a push to its exact
# branch, on a GitHub-hosted runner in the `production` environment (a required reviewer approves
# it), over SSH with a key. Its report stays on the server: this repository's job logs are public.

on:
  push:
    branches: [ops/chat-stream-diagnostics-20261026]

permissions:
  contents: read

concurrency:
  group: mizan-production
  cancel-in-progress: false

jobs:
  inspect:
    if: github.event_name == 'push' && github.repository == 'CodeWithJuber/mizan' && github.ref == 'refs/heads/ops/chat-stream-diagnostics-20261026'
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate read-only diagnostic syntax
        run: python3 -m py_compile scripts/chat_stream_diagnostics.py
      - name: Inspect fixed QA time window without changing services or data
        env:
          SSH_HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_USER }}
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$SSH_HOST" && test -n "$SSH_USER" && test -n "$SSH_KEY" && test -n "$KNOWN_HOSTS"
          keys="$RUNNER_TEMP/deploy-ssh"
          install -d -m 700 "$keys"
          trap 'rm -rf "$keys"' EXIT
          printf '%s\n' "$SSH_KEY" > "$keys/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$keys/known_hosts"
          chmod 600 "$keys/key" "$keys/known_hosts"
          ssh_options=(-i "$keys/key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$keys/known_hosts" -o ConnectTimeout=15)
          remote_dir=$(ssh "${ssh_options[@]}" "$SSH_USER@$SSH_HOST" 'umask 077; test -d /var/lib/mizan-deploy && mktemp -d /var/lib/mizan-deploy/chat-diagnostics.XXXXXXXX')
          [[ "$remote_dir" =~ ^/var/lib/mizan-deploy/chat-diagnostics\.[A-Za-z0-9]{8}$ ]]
          trap 'ssh "${ssh_options[@]}" "$SSH_USER@$SSH_HOST" "rm -f '\''$remote_dir/chat_stream_diagnostics.py'\'' && rmdir '\''$remote_dir'\''" || true; rm -rf "$keys"' EXIT
          scp "${ssh_options[@]}" scripts/chat_stream_diagnostics.py "$SSH_USER@$SSH_HOST:$remote_dir/"
          # The report is kept on the server, root-only; the log shows where and its SHA-256.
          report="/var/lib/mizan-deploy/reports/chat-stream-diagnostics-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.json"
          ssh "${ssh_options[@]}" "$SSH_USER@$SSH_HOST" "umask 077 && mkdir -p /var/lib/mizan-deploy/reports && test -f /var/lib/mizan-deploy/deploy.lock && status=0 && { flock -s -w 30 /var/lib/mizan-deploy/deploy.lock timeout 240s python3 '$remote_dir/chat_stream_diagnostics.py' > '$report' || status=\$?; } && sha256sum '$report' && exit \$status"
