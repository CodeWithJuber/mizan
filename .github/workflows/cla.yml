name: CLA

# Contributors sign the Contributor License Agreement (CLA.md) once, by commenting on their pull
# request; the signatures are kept on the cla-signatures branch (docs/ci-artifacts.md).
#
# pull_request_target runs with this repository's token, so this workflow never checks out or runs
# the pull request's code: the action only reads the pull request's commits and comments. The
# repository owner's own pull requests skip it.

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  contents: read

jobs:
  cla:
    name: CLA signed
    runs-on: ubuntu-24.04
    if: >-
      (github.event_name == 'pull_request_target' &&
       github.event.pull_request.user.login != 'CodeWithJuber') ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request &&
       (github.event.comment.body == 'recheck' ||
        github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'))
    permissions:
      actions: write
      # Commits the signatures file to the cla-signatures branch.
      contents: write
      pull-requests: write
      statuses: write
    steps:
      - uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: "https://github.com/CodeWithJuber/mizan/blob/main/CLA.md"
          path-to-signatures: "signatures/version1/cla.json"
          branch: "cla-signatures"
          allowlist: "CodeWithJuber,*[bot]"
          create-file-commit-message: "Create the CLA signatures file"
          signed-commit-message: "$contributorName signed the CLA in $owner/$repo#$pullRequestNo"
