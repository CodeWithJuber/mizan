name: Verify Workspace Setup Recovery

on:
  push:
    branches: [ops/recover-workspace-runner-20261025]

permissions:
  contents: read

concurrency:
  group: mizan-production
  cancel-in-progress: false

jobs:
  recover:
    if: github.event_name == 'push' && github.repository == 'CodeWithJuber/mizan' && github.ref == 'refs/heads/ops/recover-workspace-runner-20261025'
    runs-on: ubuntu-24.04
    # Ten-minute lock wait, ten-minute recovery budget, and SSH/setup overhead.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Validate reviewed recovery script
        run: python3 -m py_compile scripts/setup_workspace_runner.py
      - name: Install SSH client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
      - name: Restore and verify the protected backend snapshot
        env:
          SSH_HOST: ${{ secrets.SSH_COMPUTING_HOST || vars.SSH_COMPUTING_HOST }}
          SSH_USER: ${{ secrets.SSH_COMPUTING_HOST_USER || vars.SSH_COMPUTING_HOST_USER }}
          SSHPASS: ${{ secrets.SSH_COMPUTING_HOST_PASSWORD }}
          GH_TOKEN: ${{ github.token }}
          EXPECTED_BACKEND_SHA: 0176a873e266d942918de47f8888071568eeeeb2
        run: |
          set -euo pipefail
          test -n "$SSH_HOST" && test -n "$SSH_USER" && test -n "$SSHPASS"
          test -s deploy/known_hosts
          current=$(gh api repos/CodeWithJuber/mizan/commits/main --jq .sha)
          test "$current" = "$EXPECTED_BACKEND_SHA" || { echo '::error::Main changed; review recovery target.'; exit 1; }
          ssh_options=(-o StrictHostKeyChecking=yes -o UserKnownHostsFile="$PWD/deploy/known_hosts" -o ConnectTimeout=15)
          remote_dir=$(sshpass -e ssh "${ssh_options[@]}" "$SSH_USER@$SSH_HOST" 'umask 077; test -d /var/lib/mizan-deploy && mktemp -d /var/lib/mizan-deploy/workspace-recovery.XXXXXXXX')
          [[ "$remote_dir" =~ ^/var/lib/mizan-deploy/workspace-recovery\.[A-Za-z0-9]{8}$ ]]
          trap 'sshpass -e ssh "${ssh_options[@]}" "$SSH_USER@$SSH_HOST" "rm -f '\''$remote_dir/setup.py'\'' && rmdir '\''$remote_dir'\''" || true' EXIT
          sshpass -e scp "${ssh_options[@]}" scripts/setup_workspace_runner.py "$SSH_USER@$SSH_HOST:$remote_dir/setup.py"
          sshpass -e ssh "${ssh_options[@]}" "$SSH_USER@$SSH_HOST" "python3 '$remote_dir/setup.py' --sha '$EXPECTED_BACKEND_SHA' --repository codewithjuber/mizan --rollback"
