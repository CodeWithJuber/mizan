name: Verify Workspace Setup Recovery

# A completed production operation, kept as a record (docs/runner-setup.md). It runs only on a
# push to its exact branch, on a GitHub-hosted runner in the `production` environment (a required
# reviewer approves it), over SSH with a key. The installer prints only stage names and receipts.

on:
  push:
    branches: [ops/recover-workspace-runner-20261025]

permissions:
  contents: read

concurrency:
  group: mizan-production
  cancel-in-progress: false

jobs:
  recover:
    if: github.event_name == 'push' && github.repository == 'CodeWithJuber/mizan' && github.ref == 'refs/heads/ops/recover-workspace-runner-20261025'
    runs-on: ubuntu-24.04
    environment: production
    # Ten-minute lock wait, ten-minute recovery budget, and SSH/setup overhead.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate reviewed recovery script
        run: python3 -m py_compile scripts/setup_workspace_runner.py
      - name: Restore and verify the protected backend snapshot
        env:
          SSH_HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_USER }}
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          PUBLIC_URL: ${{ secrets.DEPLOY_PUBLIC_URL }}
          GH_TOKEN: ${{ github.token }}
          EXPECTED_BACKEND_SHA: 0176a873e266d942918de47f8888071568eeeeb2
        run: |
          set -euo pipefail
          test -n "$SSH_HOST" && test -n "$SSH_USER" && test -n "$SSH_KEY" && test -n "$KNOWN_HOSTS"
          [[ "$PUBLIC_URL" =~ ^https://[A-Za-z0-9.-]+(:[0-9]{1,5})?/?$ ]] || { echo '::error::DEPLOY_PUBLIC_URL must be an https:// origin'; exit 1; }
          current=$(gh api repos/CodeWithJuber/mizan/commits/main --jq .sha)
          test "$current" = "$EXPECTED_BACKEND_SHA" || { echo '::error::Main changed; review recovery target.'; exit 1; }
          keys="$RUNNER_TEMP/deploy-ssh"
          install -d -m 700 "$keys"
          trap 'rm -rf "$keys"' EXIT
          printf '%s\n' "$SSH_KEY" > "$keys/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$keys/known_hosts"
          chmod 600 "$keys/key" "$keys/known_hosts"
          ssh_options=(-i "$keys/key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$keys/known_hosts" -o ConnectTimeout=15)
          remote_dir=$(ssh "${ssh_options[@]}" "$SSH_USER@$SSH_HOST" 'umask 077; test -d /var/lib/mizan-deploy && mktemp -d /var/lib/mizan-deploy/workspace-recovery.XXXXXXXX')
          [[ "$remote_dir" =~ ^/var/lib/mizan-deploy/workspace-recovery\.[A-Za-z0-9]{8}$ ]]
          trap 'ssh "${ssh_options[@]}" "$SSH_USER@$SSH_HOST" "rm -f '\''$remote_dir/setup.py'\'' && rmdir '\''$remote_dir'\''" || true; rm -rf "$keys"' EXIT
          scp "${ssh_options[@]}" scripts/setup_workspace_runner.py "$SSH_USER@$SSH_HOST:$remote_dir/setup.py"
          ssh "${ssh_options[@]}" "$SSH_USER@$SSH_HOST" "MIZAN_PUBLIC_URL='${PUBLIC_URL%/}' python3 '$remote_dir/setup.py' --sha '$EXPECTED_BACKEND_SHA' --repository codewithjuber/mizan --rollback"
