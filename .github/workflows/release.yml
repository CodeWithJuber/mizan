name: Release

# Runs on the self-hosted runner labelled mizan and uses nothing GitHub bills for
# (docs/ci-artifacts.md). The release's Docker images are built as a check but not published:
# GitHub Packages is billed, and production gets its images from Deploy Production instead.
# GitHub releases and their assets are free.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  # PyPI trusted publishing: GitHub's OIDC token is exchanged for a short-lived PyPI token.
  id-token: write

jobs:
  # ──── Build & Test ────────────────────────────────────────────
  validate:
    name: Validate release
    runs-on: [self-hosted, linux, x64, mizan]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Fresh Python environment
        run: python -m venv --clear "$RUNNER_TEMP/venv" && echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
      - run: pip install -e ".[dev,nlp]"
      # The learning-cycle files run training stages: by hand (docs/ci-artifacts.md, Not in CI).
      - run: >-
          pytest tests/ -v --tb=short --ignore=tests/test_owned_learning_cycle.py
          --ignore=tests/test_owned_checkpoint_activation.py --ignore=tests/test_owned_learning_service.py

  # ──── PyPI ────────────────────────────────────────────────────
  publish-pypi:
    name: Publish to PyPI
    runs-on: [self-hosted, linux, x64, mizan]
    needs: validate
    if: vars.ENABLE_PYPI_PUBLISH == 'true' && github.event.repository.private == false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Fresh Python environment
        run: python -m venv --clear "$RUNNER_TEMP/venv" && echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
      - run: pip install "build>=1.6.1,<2" "twine>=6.1,<7"
      - run: python -m build
      - run: twine check dist/*
      # pypa/gh-action-pypi-publish runs in a Docker container action, which cannot mount this
      # runner's workspace. The same trusted publishing, done here: no stored PyPI token.
      - name: Publish to PyPI
        run: |
          set -euo pipefail
          oidc=$(curl -fsS --retry 3 -H @- "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=pypi" \
            <<< "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" | jq -r .value)
          echo "::add-mask::$oidc"
          token=$(jq -n --arg token "$oidc" '{token: $token}' |
            curl -fsS --retry 3 -X POST -H 'Content-Type: application/json' --data @- \
              https://pypi.org/_/oidc/mint-token | jq -r .token)
          echo "::add-mask::$token"
          TWINE_USERNAME=__token__ TWINE_PASSWORD="$token" twine upload --non-interactive dist/*

  # ──── Docker ──────────────────────────────────────────────────
  docker:
    name: Build Docker images
    runs-on: [self-hosted, linux, x64, mizan]
    needs: validate
    steps:
      - uses: actions/checkout@v7
      # Untagged, so the runner's next image prune removes them; the build cache stays.
      - name: Backend image
        run: docker build -f docker/Dockerfile.backend.prod .
      - name: Frontend image
        run: docker build -f docker/Dockerfile.frontend.prod ./frontend

  # ──── GitHub Release ──────────────────────────────────────────
  github-release:
    name: Create GitHub Release
    runs-on: [self-hosted, linux, x64, mizan]
    needs: [validate, docker]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Fresh Python environment
        run: python -m venv --clear "$RUNNER_TEMP/venv" && echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Extract changelog for this version
        id: changelog
        run: |
          # Extract the changelog section for this version
          VERSION="${{ steps.version.outputs.version }}"
          SECTION=$(sed -n "/^## \[v${VERSION}\]/,/^## \[v/p" CHANGELOG.md | sed '$d')
          if [ -z "$SECTION" ]; then
            SECTION="Release v${VERSION}"
          fi
          # Write to file for multiline output
          echo "$SECTION" > "$RUNNER_TEMP/release_notes.md"

      - name: Build Python package
        run: |
          pip install "build>=1.6.1,<2"
          python -m build

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: "MIZAN v${{ steps.version.outputs.version }}"
          body_path: ${{ runner.temp }}/release_notes.md
          draft: false
          prerelease: ${{ contains(github.ref_name, 'rc') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') }}
          files: |
            dist/*.whl
            dist/*.tar.gz
          generate_release_notes: true
