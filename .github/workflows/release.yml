name: Release

# Runs on GitHub-hosted runners (docs/ci-artifacts.md). The release's Docker images are built as a
# check but not published: production gets its images from Deploy Production. PyPI publishing is
# opt-in (repository variable ENABLE_PYPI_PUBLISH) and uses trusted publishing: no stored token.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # ──── Build & Test ────────────────────────────────────────────
  validate:
    name: Validate release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,nlp]"
      # The learning-cycle files run training stages: CI's weekly own-research job runs them.
      - run: >-
          pytest tests/ -v --tb=short --ignore=tests/test_owned_learning_cycle.py
          --ignore=tests/test_owned_checkpoint_activation.py --ignore=tests/test_owned_learning_service.py

  # ──── PyPI ────────────────────────────────────────────────────
  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-24.04
    needs: validate
    if: vars.ENABLE_PYPI_PUBLISH == 'true' && github.event.repository.private == false
    # PyPI's trusted publisher names this repository, this workflow (release.yml) and this
    # environment (docs/deployment.md).
    environment: pypi
    permissions:
      contents: read
      # Trusted publishing: GitHub's OIDC token is exchanged for a short-lived PyPI token.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install "build>=1.6.1,<2" "twine>=6.1,<7"
      - run: python -m build
      - run: twine check dist/*
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  # ──── Docker ──────────────────────────────────────────────────
  docker:
    name: Build Docker images
    runs-on: ubuntu-24.04
    needs: validate
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Backend image
        run: docker build -f docker/Dockerfile.backend.prod .
      - name: Frontend image
        run: docker build -f docker/Dockerfile.frontend.prod ./frontend

  # ──── GitHub Release ──────────────────────────────────────────
  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-24.04
    needs: [validate, docker]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Extract changelog for this version
        id: changelog
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Extract the changelog section for this version
          SECTION=$(sed -n "/^## \[v${VERSION}\]/,/^## \[v/p" CHANGELOG.md | sed '$d')
          if [ -z "$SECTION" ]; then
            SECTION="Release v${VERSION}"
          fi
          # Write to file for multiline output
          echo "$SECTION" > "$RUNNER_TEMP/release_notes.md"

      - name: Build Python package
        run: |
          pip install "build>=1.6.1,<2"
          python -m build

      - name: Create GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          name: "MIZAN v${{ steps.version.outputs.version }}"
          body_path: ${{ runner.temp }}/release_notes.md
          draft: false
          prerelease: ${{ contains(github.ref_name, 'rc') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') }}
          files: |
            dist/*.whl
            dist/*.tar.gz
          generate_release_notes: true
