name: Coding Workspace Isolation

# Heavy (two images, real sandboxes): it runs once per change, on main after the merge, when the
# merge changed what it tests (docs/ci-artifacts.md, What a run checks), and by hand.
on:
  push:
    branches: [main]
    paths:
      - 'backend/workspace/**'
      - 'backend/api/coding_workspace.py'
      - 'backend/api/workspace_sessions.py'
      - 'backend/api/artifacts.py'
      - 'backend/skills/builtin/coding_workspace.py'
      - 'docker/Dockerfile.workspace-*'
      - 'tests/test_coding_workspace.py'
      - 'tests/test_workspace_sessions.py'
      - 'scripts/build_workspace_image.sh'
      - 'tests/test_workspace_image_build.py'
      - 'scripts/setup_workspace_runner.py'
      - '.github/workflows/coding-workspace.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolation:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Install API test dependencies
        run: python -m pip install -e '.[dev,nlp]' 'Pillow==13.0.0'
      - name: Build the pinned private runner and isolated runtime
        run: |
          bash scripts/build_workspace_image.sh workspace-runtime mizan-workspace-runtime:v1 --load
          bash scripts/build_workspace_image.sh workspace-runner mizan-workspace-runner:v1 --load
      - name: Verify runner image imports without Docker access
        run: |
          docker run --rm --user 65534:65534 --network none --read-only --cap-drop ALL --security-opt no-new-privileges mizan-workspace-runner:v1 /bin/sh -c 'docker --version && python -c "from workspace.runner import app; assert app.docs_url is None"'
      - name: Test owner boundaries and real code execution
        env:
          MIZAN_DATA_DIR: ${{ runner.temp }}/coding-test-data
          DB_PATH: ${{ runner.temp }}/coding-test-data/memory.db
          # The hosted runner reaches the internet over HTTPS: also prove allowlisted registries work.
          MIZAN_TEST_EGRESS_INTERNET: '1'
        run: |
          mkdir -p "$MIZAN_DATA_DIR"
          pytest tests/test_coding_workspace.py tests/test_artifacts.py tests/test_workspace_sessions.py -v --tb=short
