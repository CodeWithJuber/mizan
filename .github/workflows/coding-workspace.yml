name: Coding Workspace Isolation

on:
  pull_request:
    paths:
      - 'backend/workspace/**'
      - 'backend/api/coding_workspace.py'
      - 'backend/api/artifacts.py'
      - 'backend/skills/builtin/coding_workspace.py'
      - 'docker/Dockerfile.workspace-*'
      - 'tests/test_coding_workspace.py'
      - '.github/workflows/coding-workspace.yml'
  push:
    branches: [main]
    paths:
      - 'backend/workspace/**'
      - 'backend/api/coding_workspace.py'
      - 'backend/api/artifacts.py'
      - 'backend/skills/builtin/coding_workspace.py'
      - 'docker/Dockerfile.workspace-*'
      - 'tests/test_coding_workspace.py'
      - '.github/workflows/coding-workspace.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolation:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install API test dependencies
        run: python -m pip install -e '.[dev,nlp]' 'Pillow==12.3.0'
      - name: Build the pinned private runner and isolated runtime
        run: |
          docker build --build-arg BASE_REGISTRY=mirror.gcr.io/library -f docker/Dockerfile.workspace-runtime -t mizan-workspace-runtime:v1 .
          docker build --build-arg BASE_REGISTRY=mirror.gcr.io/library -f docker/Dockerfile.workspace-runner -t mizan-workspace-runner:v1 .
      - name: Verify runner image imports without Docker access
        run: |
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges mizan-workspace-runner:v1 /bin/sh -c 'docker --version && python -c "from workspace.runner import app; assert app.docs_url is None"'
      - name: Test owner boundaries and real code execution
        env:
          MIZAN_DATA_DIR: ${{ runner.temp }}/coding-test-data
          DB_PATH: ${{ runner.temp }}/coding-test-data/memory.db
        run: |
          mkdir -p "$MIZAN_DATA_DIR"
          pytest tests/test_coding_workspace.py tests/test_artifacts.py -v --tb=short

  publish:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: isolation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Build reviewed images from the tested main commit
        run: |
          docker build --build-arg BASE_REGISTRY=mirror.gcr.io/library -f docker/Dockerfile.workspace-runtime -t mizan-workspace-runtime:v1 .
          docker build --build-arg BASE_REGISTRY=mirror.gcr.io/library -f docker/Dockerfile.workspace-runner -t mizan-workspace-runner:v1 .
      - name: Publish tested immutable images for main
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          registry_config="$RUNNER_TEMP/coding-registry-config"
          mkdir -m 700 "$registry_config"
          export DOCKER_CONFIG="$registry_config"
          trap 'rm -rf "$registry_config"' EXIT
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GHCR_USER" --password-stdin
          for component in runtime runner; do
            destination="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/mizan-workspace-$component:$GITHUB_SHA"
            docker tag "mizan-workspace-$component:v1" "$destination"
            docker push "$destination"
          done
