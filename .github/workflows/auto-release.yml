name: Auto Release

# Automatically creates a release when a PR is merged to main/master.
# Determines version bump from PR labels or commit messages:
#   - Label "release:major" or commit with "BREAKING CHANGE" → major bump
#   - Label "release:minor" or commit with "feat:" → minor bump
#   - Label "release:patch" or commit with "fix:" → patch bump
#   - Label "release:beta" → beta pre-release
#   - Label "release:skip" → skip release entirely
#
# Can also be triggered manually via workflow_dispatch.
#
# Off until the owner turns it on: it creates releases only when the repository variable
# ENABLE_AUTO_RELEASE is "true" (docs/deployment.md). It reads the deployment receipt over SSH, so
# it runs in the `production` environment.

on:
  workflow_run:
    workflows: [Deploy Production]
    types: [completed]
    branches: [main, master]
  workflow_dispatch:
    inputs:
      bump_type:
        description: "Version bump type"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
          - beta

permissions:
  contents: read

concurrency:
  group: mizan-release
  cancel-in-progress: false

jobs:
  determine-release:
    name: Determine release type
    runs-on: ubuntu-24.04
    environment: production
    permissions:
      contents: read
      pull-requests: read
    # Skip release commits to avoid infinite loops
    if: >-
      vars.ENABLE_AUTO_RELEASE == 'true' &&
      github.event.repository.private == false &&
      ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
       github.event.workflow_run.conclusion == 'success')
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      bump_type: ${{ steps.check.outputs.bump_type }}
      is_prerelease: ${{ steps.check.outputs.is_prerelease }}
      release_sha: ${{ steps.source.outputs.sha }}
      release_branch: ${{ steps.source.outputs.branch }}
    steps:
      - name: Check out the receipt reader
        if: github.event_name == 'workflow_run' && github.event.workflow_run.event != 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            scripts/deployment_receipt.py
          sparse-checkout-cone-mode: false
      - name: Read the compute-server receipt for this deployment attempt
        id: proof
        if: github.event_name == 'workflow_run' && github.event.workflow_run.event != 'pull_request'
        env:
          SSH_HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_USER }}
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          STARTED: ${{ github.event.workflow_run.run_started_at }}
        run: |
          set -euo pipefail
          [[ "$RUN_ID" =~ ^[1-9][0-9]*$ && "$ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          [[ "$STARTED" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$ ]]
          keys="$RUNNER_TEMP/deploy-ssh"
          install -d -m 700 "$keys"
          trap 'rm -rf "$keys"' EXIT
          printf '%s\n' "$SSH_KEY" > "$keys/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$keys/known_hosts"
          chmod 600 "$keys/key" "$keys/known_hosts"
          sha=$(ssh -i "$keys/key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$keys/known_hosts" -o ConnectTimeout=15 \
            "$SSH_USER@$SSH_HOST" "python3 - read $GITHUB_REPOSITORY_ID $RUN_ID $ATTEMPT $STARTED" < scripts/deployment_receipt.py)
          [[ -z "$sha" || "$sha" =~ ^[a-f0-9]{40}$ ]]
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Select the verified source commit
        id: source
        env:
          EVENT: ${{ github.event_name }}
          VERIFIED_SHA: ${{ steps.proof.outputs.sha }}
          RELEASE_BRANCH: ${{ github.event.workflow_run.head_branch || github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # The token goes in on stdin, never on a command line.
          github_api() {
            curl -fsS --retry 3 -H 'Accept: application/vnd.github+json' -H @- "$GITHUB_API_URL/$1" \
              <<< "Authorization: Bearer $GH_TOKEN"
          }
          sha="$GITHUB_SHA"
          if [ "$EVENT" = 'workflow_run' ]; then
            sha="$VERIFIED_SHA"
            if [ -z "$sha" ]; then exit 0; fi
          fi
          [[ "$sha" =~ ^[a-f0-9]{40}$ ]] || exit 1
          current=$(github_api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_BRANCH" | jq -r .sha)
          if [ "$current" != "$sha" ]; then exit 0; fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "branch=$RELEASE_BRANCH" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.source.outputs.sha != ''
        with:
          fetch-depth: 0
          ref: ${{ steps.source.outputs.sha }}
          persist-credentials: false

      - name: Check release type
        id: check
        if: steps.source.outputs.sha != ''
        env:
          MANUAL_BUMP: ${{ github.event.inputs.bump_type }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # The token goes in on stdin, never on a command line.
          github_api() {
            curl -fsS --retry 3 -H 'Accept: application/vnd.github+json' -H @- "$GITHUB_API_URL/$1" \
              <<< "Authorization: Bearer $GH_TOKEN"
          }
          BUMP=""
          IS_PRE="false"

          # Manual trigger takes priority
          if [ -n "$MANUAL_BUMP" ]; then
            if [ "$MANUAL_BUMP" = "beta" ]; then
              BUMP="beta"
              IS_PRE="true"
            else
              BUMP="$MANUAL_BUMP"
            fi
            {
              echo "should_release=true"
              echo "bump_type=$BUMP"
              echo "is_prerelease=$IS_PRE"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Check merged PR labels
          PR_NUMBER=$(github_api "repos/$GITHUB_REPOSITORY/commits/$(git rev-parse HEAD)/pulls" | jq -r '[.[] | select(.merged_at != null)] | last | .number // empty')
          if [ -n "$PR_NUMBER" ]; then
            LABELS=$(github_api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" 2>/dev/null | jq -r '.labels[].name' 2>/dev/null || echo "")

            if echo "$LABELS" | grep -q "release:skip"; then
              {
                echo "should_release=false"
                echo "bump_type="
                echo "is_prerelease=false"
              } >> "$GITHUB_OUTPUT"
              exit 0
            fi

            if echo "$LABELS" | grep -q "release:major"; then BUMP="major"; fi
            if echo "$LABELS" | grep -q "release:minor"; then BUMP="minor"; fi
            if echo "$LABELS" | grep -q "release:patch"; then BUMP="patch"; fi
            if echo "$LABELS" | grep -q "release:beta"; then BUMP="beta"; IS_PRE="true"; fi
          fi

          # Fallback: detect from commit messages
          if [ -z "$BUMP" ]; then
            LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
            if [ -n "$LAST_TAG" ]; then
              COMMITS=$(git log "$LAST_TAG..HEAD" --pretty=format:"%s" --no-merges)
            else
              COMMITS=$(git log --pretty=format:"%s" --no-merges -20)
            fi

            if echo "$COMMITS" | grep -qiE "BREAKING CHANGE|^feat!:"; then
              BUMP="major"
            elif echo "$COMMITS" | grep -qiE "^feat(\(.+\))?:"; then
              BUMP="minor"
            elif echo "$COMMITS" | grep -qiE "^fix(\(.+\))?:"; then
              BUMP="patch"
            fi
          fi

          # Default: no auto-release unless there's a clear signal
          if [ -z "$BUMP" ]; then
            {
              echo "should_release=false"
              echo "bump_type="
              echo "is_prerelease=false"
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "should_release=true"
              echo "bump_type=$BUMP"
              echo "is_prerelease=$IS_PRE"
            } >> "$GITHUB_OUTPUT"
          fi

  auto-release:
    name: Create release
    runs-on: ubuntu-24.04
    needs: determine-release
    if: needs.determine-release.outputs.should_release == 'true'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ needs.determine-release.outputs.release_sha }}
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Bump version
        id: bump
        run: |
          BUMP_TYPE="${{ needs.determine-release.outputs.bump_type }}"
          CURRENT=$(tr -d '[:space:]' < VERSION)

          if [ "$BUMP_TYPE" = "beta" ]; then
            # Parse current version
            BASE=${CURRENT%%-*}
            IFS='.' read -r MAJOR MINOR PATCH <<< "$BASE"
            NEXT_MINOR="$MAJOR.$((MINOR + 1)).0"

            # Check if already in beta
            if echo "$CURRENT" | grep -q "beta"; then
              BETA_NUM=$(echo "$CURRENT" | grep -oP 'beta\.\K[0-9]+')
              NEW_VERSION="${NEXT_MINOR}-beta.$((BETA_NUM + 1))"
            else
              NEW_VERSION="${NEXT_MINOR}-beta.1"
            fi
          else
            # Standard semantic version bump
            BASE=${CURRENT%%-*}
            IFS='.' read -r MAJOR MINOR PATCH <<< "$BASE"
            case "$BUMP_TYPE" in
              patch) NEW_VERSION="$MAJOR.$MINOR.$((PATCH + 1))" ;;
              minor) NEW_VERSION="$MAJOR.$((MINOR + 1)).0" ;;
              major) NEW_VERSION="$((MAJOR + 1)).0.0" ;;
            esac
          fi

          {
            echo "current=$CURRENT"
            echo "new_version=$NEW_VERSION"
            echo "tag=v$NEW_VERSION"
          } >> "$GITHUB_OUTPUT"
          echo "Bumping $CURRENT → $NEW_VERSION"

          # Update all version files
          echo "$NEW_VERSION" > VERSION

          cat > backend/_version.py << PYEOF
          """Single source of truth for MIZAN version — auto-generated"""

          __version__ = "$NEW_VERSION"
          PYEOF

          # Clean indentation from heredoc
          sed -i 's/^          //' backend/_version.py

          sed -i "s/^version = \".*\"/version = \"$NEW_VERSION\"/" pyproject.toml
          sed -i "s/^version: .*/version: $NEW_VERSION/" CITATION.cff
          sed -i "s/\"version\": \".*\"/\"version\": \"$NEW_VERSION\"/" frontend/package.json
          NEW_VERSION="$NEW_VERSION" python - <<'PY'
          import json, os
          from pathlib import Path
          path = Path("frontend/package-lock.json")
          data = json.loads(path.read_text())
          data["version"] = os.environ["NEW_VERSION"]
          data["packages"][""]["version"] = os.environ["NEW_VERSION"]
          path.write_text(json.dumps(data, indent=2) + "\n")
          PY

          # CLI version
          IFS='.' read -r NM NMI _ <<< "${NEW_VERSION%%-*}"
          SHORT_VER="$NM.$NMI"
          sed -i "s/MIZAN v[0-9][0-9]*\.[0-9][0-9]*/MIZAN v$SHORT_VER/" backend/cli.py
          sed -i "s/MIZAN v[0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*/MIZAN v$NEW_VERSION/" backend/cli.py

          # API version
          sed -i "s/\"version\": \"[0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*[^\"]*\"/\"version\": \"$NEW_VERSION\"/g" backend/api/main.py
          sed -i "s/version=\"[0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*[^\"]*\"/version=\"$NEW_VERSION\"/" backend/api/main.py

      - name: Generate changelog
        id: changelog
        run: |
          NEW_VERSION="${{ steps.bump.outputs.new_version }}"
          DATE=$(date +%Y-%m-%d)

          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -n "$LAST_TAG" ]; then
            COMMITS=$(git log "$LAST_TAG..HEAD" --pretty=format:"- %s" --no-merges)
          else
            COMMITS=$(git log --pretty=format:"- %s" --no-merges -20)
          fi

          # Categorize
          FEATURES=$(echo "$COMMITS" | grep -iE "^- (feat|add|new)" || true)
          FIXES=$(echo "$COMMITS" | grep -iE "^- (fix|bug|patch|hotfix)" || true)
          CHANGES=$(echo "$COMMITS" | grep -iE "^- (refactor|update|improve|enhance|chore|docs|style|perf)" || true)

          # Build entry
          ENTRY="## [v$NEW_VERSION] — $DATE"
          if [ -n "$FEATURES" ]; then
            ENTRY="$ENTRY

          ### Added
          $FEATURES"
          fi
          if [ -n "$FIXES" ]; then
            ENTRY="$ENTRY

          ### Fixed
          $FIXES"
          fi
          if [ -n "$CHANGES" ]; then
            ENTRY="$ENTRY

          ### Changed
          $CHANGES"
          fi

          # Save for release notes
          echo "$ENTRY" > "$RUNNER_TEMP/release_notes.md"

          # Prepend to CHANGELOG.md
          if [ -f CHANGELOG.md ]; then
            HEADER=$(head -3 CHANGELOG.md)
            BODY=$(tail -n +4 CHANGELOG.md)
            printf "%s\n\n%s\n\n%s" "$HEADER" "$ENTRY" "$BODY" > CHANGELOG.md
          fi

      - name: Commit and tag
        env:
          RELEASE_BRANCH: ${{ needs.determine-release.outputs.release_branch }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # The checkout keeps no credentials; the push alone gets the job's token, as a header.
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          git add -A
          git commit -m "chore: release v${{ steps.bump.outputs.new_version }}

          Bump version ${{ steps.bump.outputs.current }} → ${{ steps.bump.outputs.new_version }} and update CHANGELOG.

          [skip ci]"
          git tag -a "v${{ steps.bump.outputs.new_version }}" -m "Release v${{ steps.bump.outputs.new_version }}"
          git -c "http.https://github.com/.extraheader=$auth" push origin "HEAD:$RELEASE_BRANCH"
          git -c "http.https://github.com/.extraheader=$auth" push origin "v${{ steps.bump.outputs.new_version }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: "v${{ steps.bump.outputs.new_version }}"
          name: "MIZAN v${{ steps.bump.outputs.new_version }}"
          body_path: ${{ runner.temp }}/release_notes.md
          draft: false
          prerelease: ${{ needs.determine-release.outputs.is_prerelease == 'true' }}
          generate_release_notes: true
