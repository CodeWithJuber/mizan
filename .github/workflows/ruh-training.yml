name: Ruh Training Checks

on:
  pull_request:
    paths:
      - 'ruh_model/**'
      - 'scripts/*sequence*'
      - 'scripts/launch_kaggle_training.py'
      - 'scripts/*runpod*training*.py'
      - 'notebooks/kaggle/**'
      - '.github/workflows/ruh-training.yml'
  push:
    branches: [main, master]
    paths:
      - 'ruh_model/**'
      - 'scripts/*sequence*'
      - 'scripts/launch_kaggle_training.py'
      - 'scripts/*runpod*training*.py'
      - 'notebooks/kaggle/**'
      - '.github/workflows/ruh-training.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  training:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU training checks
        run: |
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install pytest pytest-asyncio ruff numpy pyyaml requests
      - name: Lint sequence training changes
        run: |
          ruff check ruh_model/data/sequence.py ruh_model/data/chat_sources.py ruh_model/train_sequence.py ruh_model/tests/test_sequence_training.py ruh_model/tests/test_training_acceleration.py ruh_model/tests/test_training_controller.py scripts/prepare_sequence_data.py scripts/launch_kaggle_training.py scripts/launch_runpod_training.py scripts/runpod_training_job.py
      - name: Test tokenizer, model, training and checkpoint compatibility
        run: python -m pytest ruh_model/tests/ -q
      - name: Validate commit-pinned notebook code cells
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for notebook in Path('notebooks/kaggle').rglob('*.ipynb'):
              data = json.loads(notebook.read_text())
              for cell in data['cells']:
                  if cell['cell_type'] == 'code':
                      compile(''.join(cell['source']), str(notebook), 'exec')
          PY
