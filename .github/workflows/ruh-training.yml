name: Ruh Training Checks

on:
  pull_request:
    paths:
      - 'ruh_model/**'
      - 'scripts/*sequence*'
      - 'scripts/launch_kaggle_training.py'
      - 'scripts/*runpod*training*.py'
      - 'notebooks/kaggle/**'
      - '.github/workflows/ruh-training.yml'
  push:
    branches: [main, master]
    paths:
      - 'ruh_model/**'
      - 'scripts/*sequence*'
      - 'scripts/launch_kaggle_training.py'
      - 'scripts/*runpod*training*.py'
      - 'notebooks/kaggle/**'
      - '.github/workflows/ruh-training.yml'
  workflow_dispatch:

permissions:
  contents: read

# CPU-only checks (tokenizer, model, training loop and checkpoints on small inputs), so they run on
# the self-hosted runner, which has no GPU. Real training runs elsewhere (Kaggle, RunPod).
jobs:
  training:
    runs-on: [self-hosted, linux, x64, mizan]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Fresh Python environment
        run: python -m venv --clear "$RUNNER_TEMP/venv" && echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
      - name: Install CPU training checks
        run: |
          python -m pip install "torch==2.14.1+cpu" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install pytest pytest-asyncio numpy pyyaml requests
      - name: Test tokenizer, model, training and checkpoint compatibility
        run: python -m pytest ruh_model/tests/ -q
      - name: Validate commit-pinned notebook code cells
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for notebook in Path('notebooks/kaggle').rglob('*.ipynb'):
              data = json.loads(notebook.read_text())
              for cell in data['cells']:
                  if cell['cell_type'] == 'code':
                      compile(''.join(cell['source']), str(notebook), 'exec')
          PY
