name: Import Verified Private Research Bundle

# A completed production operation, kept as a record (docs/research-server-import.md). It runs only
# when dispatched on its exact branch, on a GitHub-hosted runner in the `production` environment (a
# required reviewer approves it), over SSH with a key. Its receipt stays on the server: this
# repository's job logs are public.

on:
  # Completed operation: branch synchronization must not rerun it.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mizan-production
  cancel-in-progress: false

jobs:
  import:
    if: github.event_name == 'workflow_dispatch' && github.repository == 'CodeWithJuber/mizan' && github.ref == 'refs/heads/ops/research-import-20261025'
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Validate reviewed scripts and encrypted envelope
        run: |
          python3 -m py_compile scripts/research_transfer_key.py scripts/encrypt_research_url.py scripts/research_server_import.py scripts/research_backend_stage.py
          python3 - <<'PY'
          import json, pathlib, re
          path = pathlib.Path('deploy/research-transfer.encrypted.json')
          assert 0 < path.stat().st_size <= 32768
          value = json.loads(path.read_bytes())
          assert set(value) == {'schema', 'key_id', 'ciphertext_b64'}
          assert value['schema'] == 'mizan-research-cms-v1'
          assert re.fullmatch('[0-9a-f]{32}', value['key_id'])
          PY
      - name: Run pinned import without backend recreation
        env:
          SSH_HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_USER }}
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$SSH_HOST" && test -n "$SSH_USER" && test -n "$SSH_KEY" && test -n "$KNOWN_HOSTS"
          [[ "$GITHUB_RUN_ID" =~ ^[0-9]+$ ]] && [[ "$GITHUB_RUN_ATTEMPT" =~ ^[0-9]+$ ]]
          keys="$RUNNER_TEMP/deploy-ssh"
          install -d -m 700 "$keys"
          trap 'rm -rf "$keys"' EXIT
          printf '%s\n' "$SSH_KEY" > "$keys/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$keys/known_hosts"
          chmod 600 "$keys/key" "$keys/known_hosts"
          ssh_options=(-i "$keys/key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$keys/known_hosts" -o ConnectTimeout=15)
          remote="/run/mizan-research-import-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          cleanup() { ssh "${ssh_options[@]}" "$SSH_USER@$SSH_HOST" "rm -rf -- '$remote'" >/dev/null 2>&1 || true; rm -rf "$keys"; }
          trap cleanup EXIT
          ssh "${ssh_options[@]}" "$SSH_USER@$SSH_HOST" "umask 077; mkdir -- '$remote'"
          scp "${ssh_options[@]}" scripts/research_transfer_key.py scripts/encrypt_research_url.py scripts/research_server_import.py scripts/research_backend_stage.py deploy/research-transfer.encrypted.json "$SSH_USER@$SSH_HOST:$remote/"
          # The receipt is kept on the server, root-only; the log shows where and its SHA-256.
          report="/var/lib/mizan-deploy/reports/research-import-receipt-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.jsonl"
          ssh "${ssh_options[@]}" "$SSH_USER@$SSH_HOST" "umask 077 && mkdir -p /var/lib/mizan-deploy/reports && status=0 && { python3 '$remote/research_server_import.py' < '$remote/research-transfer.encrypted.json' > '$report' || status=\$?; } && sha256sum '$report' && exit \$status"
