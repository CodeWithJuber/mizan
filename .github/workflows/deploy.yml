name: Restore Production Proxy
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mizan-proxy-maintenance
  cancel-in-progress: false
jobs:
  restore:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install SSH password client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
      - name: Refresh nginx and verify the public API
        env:
          SSH_HOST: ${{ secrets.SSH_COMPUTING_HOST }}
          SSH_USER: ${{ secrets.SSH_COMPUTING_HOST_USER }}
          SSHPASS: ${{ secrets.SSH_COMPUTING_HOST_PASSWORD }}
        run: |
          set -euo pipefail
          sshpass -e ssh -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$PWD/deploy/known_hosts" -o ConnectTimeout=15 "$SSH_USER@$SSH_HOST" 'docker exec mizan-nginx nginx -t && docker exec mizan-nginx nginx -s reload'
          curl --fail --silent --retry 3 --retry-delay 2 https://mizan.jubershaikh.com/api/health > /dev/null
          code=$(curl --silent --output /dev/null --write-out '%{http_code}' https://mizan.jubershaikh.com/api/status)
          test "$code" = 401
