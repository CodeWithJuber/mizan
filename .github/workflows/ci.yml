# Every job runs on the self-hosted runner labelled mizan and uses nothing GitHub bills for:
# reports stay on the runner in $CI_RESULTS_DIR, caches on its disk, images in its Docker
# (docs/ci-artifacts.md). The first job checks that, and every other job waits for it.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  billing:
    name: Bills nothing on GitHub
    runs-on: [self-hosted, linux, x64, mizan]
    steps:
      - uses: actions/checkout@v7
      - name: No hosted runner, artifact, cache, Pages, CodeQL or GitHub Packages
        run: bash scripts/ci/no-github-billing.sh

  lint:
    name: Lint
    runs-on: [self-hosted, linux, x64, mizan]
    needs: billing
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # The runner keeps setup-python's interpreters between jobs. Each job installs into its own
      # environment, so it sees only what it installs, as on a new machine (docs/ci-artifacts.md).
      - name: Fresh Python environment
        run: python -m venv --clear "$RUNNER_TEMP/venv" && echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
      # Pin to the same range as pyproject [dev] — unpinned ruff drift has
      # flipped I001 verdicts on already-committed code between releases.
      - run: pip install "ruff>=0.17.2,<0.18"
      - run: ruff check backend/ nlp/ tests/
      - run: ruff format --check backend/ nlp/ tests/

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: [self-hosted, linux, x64, mizan]
    needs: billing
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Fresh Python environment
        run: python -m venv --clear "$RUNNER_TEMP/venv" && echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
      - name: Install dependencies
        run: pip install -e ".[dev,nlp,knowledge]"
      - name: Run tests
        run: pytest tests/ -v --tb=short --cov=backend --cov-report=xml
      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v7
        with:
          files: coverage.xml

  own-research:
    name: Own architecture research invariants
    runs-on: [self-hosted, linux, x64, mizan]
    needs: billing
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Fresh Python environment
        run: python -m venv --clear "$RUNNER_TEMP/venv" && echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
      - run: pip install -e ".[dev]" jsonschema "numpy>=2.5.3,<3"
      - run: pip install --index-url https://download.pytorch.org/whl/cpu "torch==2.14.1+cpu"
      - run: pytest tests/test_mizan_owned*.py tests/test_owned_checkpoint_activation.py tests/test_owned_learning_cycle.py tests/test_owned_learning_service.py research/own_model/tests -q

  build:
    name: Build package
    permissions:
      contents: read
    runs-on: [self-hosted, linux, x64, mizan]
    needs: [lint, test, typecheck, ruh, bayan, frontend, own-research, provenance]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Fresh Python environment
        run: python -m venv --clear "$RUNNER_TEMP/venv" && echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
      - run: pip install "build>=1.6.1,<2"
      - run: python -m build
      - name: Keep the package on the runner
        run: bash scripts/ci/keep-results.sh dist dist

  typecheck:
    runs-on: [self-hosted, linux, x64, mizan]
    needs: billing
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Fresh Python environment
        run: python -m venv --clear "$RUNNER_TEMP/venv" && echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
      - run: pip install -e ".[dev,nlp,knowledge]"
      - run: PYTHONPATH=backend:. mypy backend/

  ruh:
    runs-on: [self-hosted, linux, x64, mizan]
    needs: billing
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Fresh Python environment
        run: python -m venv --clear "$RUNNER_TEMP/venv" && echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
      - run: pip install --index-url https://download.pytorch.org/whl/cpu "torch==2.14.1+cpu"
      - run: pip install -e ".[dev,nlp,knowledge]" datasets
      - run: PYTHONPATH=backend:. pytest ruh_model/tests/ -q

  bayan:
    runs-on: [self-hosted, linux, x64, mizan]
    needs: billing
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Fresh Python environment
        run: python -m venv --clear "$RUNNER_TEMP/venv" && echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
      # The vendored copy must match ruh_model/tokenizer/ (writes nothing).
      - run: python packages/bayan/scripts/sync_vendor.py --check
      - run: pip install pytest
      - run: PYTHONPATH=packages/bayan/src python -m pytest --noconftest --import-mode=importlib packages/bayan/tests -q

  frontend:
    permissions:
      contents: read
    runs-on: [self-hosted, linux, x64, mizan]
    needs: billing
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run test:utils
      - run: npm run build
      - run: npm run size
      # Chromium's system libraries are in the runner image; the browser itself is kept in the
      # runner's cache (~/.cache/ms-playwright) between runs.
      - name: Browser tests (mocked API, desktop and phone)
        run: npx playwright install chromium && npm run e2e
      - name: Keep failed browser reports on the runner
        if: failure()
        working-directory: .
        run: bash scripts/ci/keep-results.sh playwright-report --optional --base frontend playwright-report test-results

  provenance:
    name: Docker provenance preflight
    runs-on: [self-hosted, linux, x64, mizan]
    needs: billing
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - name: Set up attestation-capable builder
        id: buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver: docker-container
          cache-binary: false
      - name: Verify actual OCI provenance export
        env:
          BUILDX_BUILDER: ${{ steps.buildx.outputs.name }}
        run: python3 scripts/verify_build_provenance.py

  docker:
    name: Docker build
    runs-on: [self-hosted, linux, x64, mizan]
    needs: [lint, test, typecheck, ruh, bayan, frontend, own-research, provenance]
    steps:
      - uses: actions/checkout@v7
      - name: Build backend image
        run: docker build -f docker/Dockerfile.backend.prod -t mizan-backend .
      - name: Verify production runtime dependencies
        run: >-
          docker run --rm --entrypoint python mizan-backend
          -c "import torch, fastapi, openai, anthropic, PIL;
          from ruh_model.tokenizer.bayan import BayanTokenizer;
          from mizan_owned.learning_cycle import _implementation;
          from mizan_owned.learning_service import worker_environment;
          from importlib.metadata import version;
          assert torch.version.cuda is None;
          assert version('pip') == '26.2.1';
          assert version('setuptools') == '84.0.0';
          assert len(_implementation()) == 12;
          assert worker_environment()['PYTHONPATH'] == '/app';
          assert BayanTokenizer().encode('knowledge')"
      - name: Build frontend image
        run: docker build -f docker/Dockerfile.frontend.prod -t mizan-frontend ./frontend
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Fresh Python environment
        run: python -m venv --clear "$RUNNER_TEMP/venv" && echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
      - name: Build isolated coding images
        run: |
          bash scripts/build_workspace_image.sh workspace-runtime mizan-workspace-runtime:v1 --load
          bash scripts/build_workspace_image.sh workspace-runner mizan-workspace-runner:v1 --load
      - name: Verify the isolated runner and actual code execution
        env:
          MIZAN_DATA_DIR: ${{ runner.temp }}/isolated-coding-tests
          DB_PATH: ${{ runner.temp }}/isolated-coding-tests/memory.db
        run: |
          python -m pip install -e '.[dev,nlp]'
          mkdir -p "$MIZAN_DATA_DIR"
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges mizan-workspace-runner:v1 /bin/sh -c 'docker --version && python -c "from workspace.runner import app; assert app.docs_url is None"'
          pytest tests/test_coding_workspace.py tests/test_artifacts.py -q

  browser:
    name: Browser sandbox (Shahid)
    runs-on: [self-hosted, linux, x64, mizan]
    needs: billing
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Build the browser sandbox image
        run: bash scripts/build_workspace_image.sh workspace-browser mizan-workspace-browser:v1 --load
      - name: A real browser follows Shahid's rules inside the hardened container
        run: >-
          docker run --rm --network none --read-only --cap-drop ALL
          --security-opt no-new-privileges --user 65534:65534 --shm-size 256m
          --tmpfs /tmp:rw,nosuid,nodev,size=256m,mode=1777 --env HOME=/tmp
          mizan-workspace-browser:v1 python3 -I /browse_selftest.py
      - name: The browse egress proxy starts in public mode
        run: >-
          docker run --rm --network none --read-only --cap-drop ALL
          --security-opt no-new-privileges --env MIZAN_EGRESS_MODE=public
          mizan-workspace-browser:v1 python3 -I -c
          "import sys; sys.path.insert(0, '/'); import egress_proxy as e;
          assert e.public_mode() and e.host_allowed('example.org', e.allowlist())"

  # Deploy Production sends these images from this runner's Docker to the server over SSH
  # (docs/deployment.md): no registry, no GitHub Packages. They keep the ghcr.io/... names the
  # server's deploy state and workspace-runner installer already record, but are never pushed.
  production-images:
    name: Keep production images on the runner
    if: github.event_name == 'push'
    runs-on: [self-hosted, linux, x64, mizan]
    needs: [build, docker, provenance, browser]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Production backend
        run: docker build -f docker/Dockerfile.backend.prod -t "ghcr.io/${GITHUB_REPOSITORY,,}/backend:$GITHUB_SHA" .
      - name: Production frontend
        run: docker build -f docker/Dockerfile.frontend.prod -t "ghcr.io/${GITHUB_REPOSITORY,,}/frontend:$GITHUB_SHA" ./frontend
      - name: Isolated workspace runtime
        run: bash scripts/build_workspace_image.sh workspace-runtime "ghcr.io/${GITHUB_REPOSITORY,,}/workspace-runtime:$GITHUB_SHA" --load
      - name: Private workspace runner
        run: bash scripts/build_workspace_image.sh workspace-runner "ghcr.io/${GITHUB_REPOSITORY,,}/workspace-runner:$GITHUB_SHA" --load
      - name: The browser sandbox (Shahid)
        run: bash scripts/build_workspace_image.sh workspace-browser "ghcr.io/${GITHUB_REPOSITORY,,}/workspace-browser:$GITHUB_SHA" --load
      # A deploy sends only the newest commit on its branch, so older commits' images are dropped.
      # The server keeps the images it runs and the ones a rollback needs.
      - name: Drop earlier commits' production images
        run: |
          set -euo pipefail
          names="^ghcr\.io/${GITHUB_REPOSITORY,,}/(backend|frontend|workspace-(runtime|runner|browser)):[0-9a-f]{40}\$"
          mapfile -t earlier < <(docker image ls --format '{{.Repository}}:{{.Tag}}' |
            grep -E "$names" | grep -v ":$GITHUB_SHA\$" || true)
          if ((${#earlier[@]})); then docker image rm "${earlier[@]}" >/dev/null || true; fi
          docker image prune --force >/dev/null
