# Every job runs on a standard GitHub-hosted runner, free for a public repository
# (docs/ci-artifacts.md). The first job checks that every workflow keeps to the public-repository
# rules (scripts/ci/public-repo-guard.sh), and every other job waits for it.
#
# scripts/ci/plan.py, in the first job, says what this run checks (docs/ci-artifacts.md, What a run
# checks):
# - a pull request: typecheck and the unit tests its change reaches.
# - a push to main: lint, typecheck, every unit test, the frontend build and browser tests, and the
#   Docker images with the browser sandbox's self-test. Deploy Production follows a run that passed.
# - the weekly run and a run by hand: all of that on every supported Python, and the model and
#   training tests, which install CPU torch.
# A push to main skips its checks when an earlier full run (never a pull request's) passed with the
# same files.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 2 * * 6"
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a pull request replaces its run that is still going. No other run is cancelled
# or made to wait: Deploy Production follows the run of a push to main.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  plan:
    name: Plan and workflow guard
    runs-on: ubuntu-24.04
    # skip-duplicate-actions reads this workflow's earlier runs.
    permissions:
      actions: read
      contents: read
    outputs:
      verified: ${{ steps.plan.outputs.verified }}
      pytest: ${{ steps.plan.outputs.pytest }}
      vitest: ${{ steps.plan.outputs.vitest }}
      lint: ${{ steps.plan.outputs.lint }}
      provenance: ${{ steps.plan.outputs.provenance }}
      browser: ${{ steps.plan.outputs.browser }}
      images: ${{ steps.plan.outputs.images }}
      bayan: ${{ steps.plan.outputs.bayan }}
      utils: ${{ steps.plan.outputs.utils }}
      training: ${{ steps.plan.outputs.training }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # A pull request's change is its merge commit against the first parent: main as it is.
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 1 }}
      - name: Standard hosted runners, pinned actions, no pull request code with secrets
        run: bash scripts/ci/public-repo-guard.sh
      # After a merge, main may hold files that an earlier run of this workflow passed with (one
      # Git tree, in GitHub's own record). The plan trusts that pass only from a full run: a push,
      # the weekly run or a run by hand, never a pull request's, which checks only part. Then the
      # checking jobs are skipped. A fault in the action means "check": the step may fail, and a
      # missing answer is not a pass.
      - name: Have these files passed already?
        id: duplicate
        continue-on-error: true
        uses: fkirc/skip-duplicate-actions@b974a9395958c231af965b70070979a577efa578 # v5.3.2
        with:
          # Only a push may skip. A pull request is tested as its merge into main, which the action
          # does not see (it goes by the branch's last commit), so a pull request always runs its
          # checks, as do the weekly run and a run started by hand.
          do_not_skip: '["pull_request", "workflow_dispatch", "schedule", "merge_group"]'
      - name: What does this run check?
        id: plan
        env:
          # Only a pull request's plan reads a diff; every other run checks everything.
          BASE: ${{ github.event_name == 'pull_request' && 'HEAD^1' || '' }}
          SHOULD_SKIP: ${{ steps.duplicate.outputs.should_skip }}
          SKIPPED_BY: ${{ steps.duplicate.outputs.skipped_by }}
        run: python3 scripts/ci/plan.py

  # Lint runs on main, weekly and by hand: a pull request is not linted on each push.
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    needs: plan
    if: needs.plan.outputs.lint == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      # The same range as pyproject's [dev]: unpinned ruff drift has flipped I001 verdicts on
      # already-committed code between releases.
      - run: pip install "ruff>=0.17.2,<0.18"
      - run: ruff check backend/ nlp/ tests/
      - run: ruff format --check backend/ nlp/ tests/

  test:
    # A pull request's job is named Test, as the job of the removed pr-check.yml was, so a branch
    # protection rule that requires it still finds it.
    name: >-
      ${{ github.event_name == 'pull_request' && 'Test' ||
      format('Test (Python {0})', matrix.python-version) }}
    runs-on: ubuntu-24.04
    needs: plan
    if: needs.plan.outputs.pytest != 'none'
    strategy:
      matrix:
        # Pull requests and pushes test the Python of the production image
        # (docker/Dockerfile.backend.prod). The weekly run and a run started by hand test them all.
        python-version: >-
          ${{ fromJSON((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
          && '["3.11", "3.12", "3.13", "3.14"]' || '["3.13"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: pip install -e ".[dev,nlp,knowledge]"
      # Whole modules together on each worker (module and class fixtures stay on one worker).
      # The learning-cycle files run the owned model's training stages: the own-research job runs
      # them weekly and by hand (scripts/ci/plan.py, TRAINING_TESTS). A pull request's plan never
      # names them.
      - name: Run tests
        env:
          TESTS: ${{ needs.plan.outputs.pytest }}
        run: |
          if [ "$TESTS" = all ]; then
            learning="tests/test_owned_learning_cycle.py tests/test_owned_checkpoint_activation.py tests/test_owned_learning_service.py"
            pytest tests/ -v --tb=short -n auto --dist loadscope $(printf -- '--ignore=%s ' $learning) --cov=backend --cov-report=xml
            exit 0
          fi
          # A pull request: the test files its change reaches (scripts/ci/plan.py).
          [ -n "$TESTS" ] || { echo '::error::The plan named no tests'; exit 1; }
          pytest $TESTS -v --tb=short -n auto --dist loadscope
      # Coverage of the whole suite only: a pull request's selection would read as a drop.
      - name: Upload coverage
        if: matrix.python-version == '3.13' && needs.plan.outputs.pytest == 'all'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: coverage.xml

  # Typecheck runs on every run, pull requests included.
  typecheck:
    runs-on: ubuntu-24.04
    needs: plan
    if: needs.plan.outputs.verified != 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,nlp,knowledge]"
      - run: PYTHONPATH=backend:. mypy backend/

  bayan:
    runs-on: ubuntu-24.04
    needs: plan
    if: needs.plan.outputs.bayan == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      # The vendored copy must match ruh_model/tokenizer/ (writes nothing).
      - run: python packages/bayan/scripts/sync_vendor.py --check
      - run: pip install pytest
      - run: PYTHONPATH=packages/bayan/src python -m pytest --noconftest --import-mode=importlib packages/bayan/tests -q

  frontend:
    # Named as the job of the removed pr-check.yml was, for a branch protection rule.
    name: ${{ github.event_name == 'pull_request' && 'Frontend Build' || 'frontend' }}
    runs-on: ubuntu-24.04
    needs: plan
    if: needs.plan.outputs.verified != 'true'
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Vitest compares a pull request with its merge commit's first parent.
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 1 }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - run: npm ci
      - run: npm run typecheck
      # oxlint with its warning cap, then the colour ratchet (frontend/.color-ratchet.json).
      - run: npm run lint
        if: needs.plan.outputs.lint == 'true'
      - run: npm test
        if: needs.plan.outputs.vitest == 'all'
      # The specs whose imports reach the change; none reached is a pass.
      - run: npm test -- --changed HEAD^1 --passWithNoTests
        if: needs.plan.outputs.vitest == 'changed'
      - run: npm run test:utils
        if: needs.plan.outputs.utils == 'true'
      # The build, its size budget and the browser tests: on main, weekly and by hand.
      - run: npm run build
        if: needs.plan.outputs.browser == 'true'
      - run: npm run size
        if: needs.plan.outputs.browser == 'true'
      - name: Browser tests (mocked API, desktop and phone)
        if: needs.plan.outputs.browser == 'true'
        run: npx playwright install --with-deps chromium && npm run e2e
      - name: Keep the failed browser report
        if: failure() && needs.plan.outputs.browser == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: ignore
          retention-days: 7

  provenance:
    name: Docker provenance preflight
    runs-on: ubuntu-24.04
    needs: plan
    # On main, weekly and by hand: it gates the images.
    if: needs.plan.outputs.provenance == 'true'
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up attestation-capable builder
        id: buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver: docker-container
          cache-binary: false
      - name: Verify actual OCI provenance export
        env:
          BUILDX_BUILDER: ${{ steps.buildx.outputs.name }}
        run: python3 scripts/verify_build_provenance.py

  # The model and training tests install CPU torch: weekly and by hand only.
  ruh:
    name: Ruh model and training checks
    runs-on: ubuntu-24.04
    needs: plan
    if: needs.plan.outputs.training == 'true'
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install --index-url https://download.pytorch.org/whl/cpu "torch==2.14.1+cpu"
      - run: pip install -e ".[dev,nlp,knowledge]" datasets
      - run: PYTHONPATH=backend:. pytest ruh_model/tests/ -q
      - name: The Kaggle notebooks' code cells compile
        run: >-
          python3 -c 'import json, pathlib; [compile("".join(c["source"]), str(n), "exec")
          for n in pathlib.Path("notebooks/kaggle").rglob("*.ipynb")
          for c in json.loads(n.read_text())["cells"] if c["cell_type"] == "code"]'

  own-research:
    name: Own architecture research invariants and learning cycle
    runs-on: ubuntu-24.04
    needs: plan
    if: needs.plan.outputs.training == 'true'
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]" jsonschema "numpy>=2.5.3,<3"
      - run: pip install --index-url https://download.pytorch.org/whl/cpu "torch==2.14.1+cpu"
      - run: pytest tests/test_mizan_owned*.py tests/test_owned_checkpoint_activation.py tests/test_owned_learning_cycle.py tests/test_owned_learning_service.py research/own_model/tests -q

  # The images Deploy Production builds and ships, built here as a check on main, weekly and by
  # hand, after the quick checks pass. A check the plan skipped does not hold them back; a failed
  # one does. Nothing is pushed: Deploy Production builds the commit's images itself and sends
  # them to the server (docs/deployment.md).
  images:
    name: Docker images and the browser sandbox
    runs-on: ubuntu-24.04
    needs: [plan, lint, test, typecheck, bayan, frontend, provenance]
    if: ${{ !cancelled() && !failure() && needs.plan.outputs.images == 'true' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Production backend
        run: docker build -f docker/Dockerfile.backend.prod -t mizan-backend:ci .
      - name: Verify production runtime dependencies
        run: >-
          docker run --rm --entrypoint python mizan-backend:ci
          -c "import torch, fastapi, openai, anthropic, PIL;
          from ruh_model.tokenizer.bayan import BayanTokenizer;
          from mizan_owned.learning_cycle import _implementation;
          from mizan_owned.learning_service import worker_environment;
          from importlib.metadata import version;
          assert torch.version.cuda is None;
          assert version('pip') == '26.2.1';
          assert version('setuptools') == '84.0.0';
          assert len(_implementation()) == 12;
          assert worker_environment()['PYTHONPATH'] == '/app';
          assert BayanTokenizer().encode('knowledge')"
      - name: Production frontend
        run: docker build -f docker/Dockerfile.frontend.prod -t mizan-frontend:ci ./frontend
      - name: Isolated workspace runtime
        run: bash scripts/build_workspace_image.sh workspace-runtime mizan-workspace-runtime:ci --load
      - name: Private workspace runner
        run: bash scripts/build_workspace_image.sh workspace-runner mizan-workspace-runner:ci --load
      - name: The runner image imports without Docker access
        run: >-
          docker run --rm --user 65534:65534 --network none --read-only --cap-drop ALL
          --security-opt no-new-privileges mizan-workspace-runner:ci /bin/sh -c
          'docker --version && python -c "from workspace.runner import app; assert app.docs_url is None"'
      - name: The browser sandbox (Shahid)
        run: bash scripts/build_workspace_image.sh workspace-browser mizan-workspace-browser:ci --load
      - name: A real browser follows Shahid's rules inside the hardened container
        run: >-
          docker run --rm --network none --read-only --cap-drop ALL
          --security-opt no-new-privileges --user 65534:65534 --shm-size 256m
          --tmpfs /tmp:rw,nosuid,nodev,size=256m,mode=1777 --env HOME=/tmp
          mizan-workspace-browser:ci python3 -I /browse_selftest.py
      - name: The browse egress proxy starts in public mode
        run: >-
          docker run --rm --network none --read-only --cap-drop ALL
          --security-opt no-new-privileges --env MIZAN_EGRESS_MODE=public
          mizan-workspace-browser:ci python3 -I -c
          "import sys; sys.path.insert(0, '/'); import egress_proxy as e;
          assert e.public_mode() and e.host_allowed('example.org', e.allowlist())"
