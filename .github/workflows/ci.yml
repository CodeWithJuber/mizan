# Every job runs on the self-hosted runner labelled mizan and uses nothing GitHub bills for:
# reports stay on the runner in $CI_RESULTS_DIR, caches on its disk, images in its Docker
# (docs/ci-artifacts.md). The first job checks that, and every other job waits for it.
#
# Each change gets its heavy jobs once, on main after the merge (docs/ci-artifacts.md, What a run
# checks), and scripts/ci/plan.py, in the first job, says what this run checks:
# - a pull request: typecheck and the unit tests its change reaches. No lint, no heavy job.
# - a push to main: lint, typecheck, every unit test, and the heavy jobs whose inputs the merge
#   changed compared with main before it (all of them when it cannot place the change).
# - the weekly run and a run by hand: everything, on every supported Python.
# A push to main goes straight to the production images when an earlier full run (never a pull
# request's) passed with the same files.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: "17 2 * * 6"
  workflow_dispatch:

# A newer push to a pull request replaces its run that is still going. No other run is cancelled
# or made to wait: Deploy Production follows the run of a push to main.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  billing:
    name: Bills nothing on GitHub
    runs-on: [self-hosted, linux, x64, mizan]
    # skip-duplicate-actions reads this workflow's earlier runs.
    permissions:
      actions: read
      contents: read
    outputs:
      verified: ${{ steps.plan.outputs.verified }}
      lint: ${{ steps.plan.outputs.lint }}
      pytest: ${{ steps.plan.outputs.pytest }}
      ruh: ${{ steps.plan.outputs.ruh }}
      own: ${{ steps.plan.outputs.own }}
      bayan: ${{ steps.plan.outputs.bayan }}
      vitest: ${{ steps.plan.outputs.vitest }}
      utils: ${{ steps.plan.outputs.utils }}
      provenance: ${{ steps.plan.outputs.provenance }}
      build: ${{ steps.plan.outputs.build }}
      docker: ${{ steps.plan.outputs.docker }}
      browser: ${{ steps.plan.outputs.browser }}
      frontend_build: ${{ steps.plan.outputs.frontend_build }}
    steps:
      - uses: actions/checkout@v7
        with:
          # A pull request's change is its merge commit against the first parent: main as it is.
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 1 }}
      - name: No hosted runner, artifact, cache, Pages, CodeQL or GitHub Packages
        run: bash scripts/ci/no-github-billing.sh
      # After a merge, main may hold files that an earlier run of this workflow passed with (one
      # Git tree, in GitHub's own record). The plan trusts that pass only from a full run: a push,
      # the weekly run or a run by hand, never a pull request's, which checks only part. Then the
      # checking jobs are skipped and a push builds its production images at once. A fault in the
      # action means "check": the step may fail, and a missing answer is not a pass.
      - name: Have these files passed already?
        id: duplicate
        continue-on-error: true
        uses: fkirc/skip-duplicate-actions@b974a9395958c231af965b70070979a577efa578 # v5.3.2
        with:
          # Only a push may skip. A pull request is tested as its merge into main, which the action
          # does not see (it goes by the branch's last commit), so a pull request always runs its
          # checks, as do the weekly run and a run started by hand.
          do_not_skip: '["pull_request", "workflow_dispatch", "schedule", "merge_group"]'
      # A push to main is compared with main before it. Without that commit (a new branch, a
      # force-push), the plan cannot place the change and runs every heavy job.
      - name: Fetch main before the push
        if: github.event_name == 'push'
        continue-on-error: true
        env:
          BEFORE: ${{ github.event.before }}
        run: git fetch --no-tags --depth=1 origin "$BEFORE"
      - name: What does this run check?
        id: plan
        env:
          BASE: ${{ github.event_name == 'pull_request' && 'HEAD^1' || github.event.before }}
          SHOULD_SKIP: ${{ steps.duplicate.outputs.should_skip }}
          SKIPPED_BY: ${{ steps.duplicate.outputs.skipped_by }}
        run: python3 scripts/ci/plan.py

  # Lint runs on main, weekly and by hand: a pull request is not linted on each push.
  lint:
    name: Lint
    runs-on: [self-hosted, linux, x64, mizan]
    needs: billing
    if: needs.billing.outputs.lint == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # The runner keeps setup-python's interpreters between jobs. Each job installs into its own
      # environment, so it sees only what it installs, as on a new machine (docs/ci-artifacts.md).
      - name: Fresh Python environment
        run: python -m venv --clear "$RUNNER_TEMP/venv" && echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
      # Pin to the same range as pyproject [dev] — unpinned ruff drift has
      # flipped I001 verdicts on already-committed code between releases.
      - run: pip install "ruff>=0.17.2,<0.18"
      - run: ruff check backend/ nlp/ tests/
      - run: ruff format --check backend/ nlp/ tests/

  test:
    # A pull request's job is named Test, as the job of the removed pr-check.yml was, so a branch
    # protection rule that requires it still finds it.
    name: >-
      ${{ github.event_name == 'pull_request' && 'Test' ||
      format('Test (Python {0})', matrix.python-version) }}
    runs-on: [self-hosted, linux, x64, mizan]
    needs: billing
    if: needs.billing.outputs.pytest != 'none'
    strategy:
      matrix:
        # Pull requests and pushes test the Python of the production image
        # (docker/Dockerfile.backend.prod). The weekly run and a run started by hand test them all.
        python-version: >-
          ${{ fromJSON((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
          && '["3.11", "3.12", "3.13", "3.14"]' || '["3.13"]') }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Fresh Python environment
        run: python -m venv --clear "$RUNNER_TEMP/venv" && echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
      - name: Install dependencies
        run: pip install -e ".[dev,nlp,knowledge]"
      # Six workers, whole modules together (module and class fixtures stay on one worker).
      # The learning-cycle files run their stages as subprocesses with fixed time limits, so
      # they run alone afterwards, when no other worker is loading the machine.
      - name: Run tests
        env:
          TESTS: ${{ needs.billing.outputs.pytest }}
        run: |
          learning="tests/test_owned_learning_cycle.py tests/test_owned_checkpoint_activation.py tests/test_owned_learning_service.py"
          if [ "$TESTS" = all ]; then
            pytest tests/ -v --tb=short -n 6 --dist loadscope $(printf -- '--ignore=%s ' $learning) --cov=backend
            pytest $learning -v --tb=short --cov=backend --cov-append --cov-report=xml
            exit 0
          fi
          # A pull request: the test files its change reaches (scripts/ci/plan.py), the same way.
          [ -n "$TESTS" ] || { echo '::error::The plan named no tests'; exit 1; }
          parallel=() alone=()
          for file in $TESTS; do
            case " $learning " in *" $file "*) alone+=("$file") ;; *) parallel+=("$file") ;; esac
          done
          if ((${#parallel[@]})); then pytest "${parallel[@]}" -v --tb=short -n 6 --dist loadscope; fi
          if ((${#alone[@]})); then pytest "${alone[@]}" -v --tb=short; fi
      # Coverage of the whole suite only: a pull request's selection would read as a drop.
      - name: Upload coverage
        if: matrix.python-version == '3.13' && needs.billing.outputs.pytest == 'all'
        uses: codecov/codecov-action@v7
        with:
          files: coverage.xml

  own-research:
    name: Own architecture research invariants
    runs-on: [self-hosted, linux, x64, mizan]
    needs: billing
    if: needs.billing.outputs.own == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Fresh Python environment
        run: python -m venv --clear "$RUNNER_TEMP/venv" && echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
      - run: pip install -e ".[dev]" jsonschema "numpy>=2.5.3,<3"
      - run: pip install --index-url https://download.pytorch.org/whl/cpu "torch==2.14.1+cpu"
      - run: pytest tests/test_mizan_owned*.py tests/test_owned_checkpoint_activation.py tests/test_owned_learning_cycle.py tests/test_owned_learning_service.py research/own_model/tests -q

  # The heavy jobs (this one, docker and browser) run on main when the merge changed what they
  # build, weekly and by hand, after the quick jobs pass. A quick job the plan skipped does not
  # hold them back; a failed one does.
  build:
    name: Build package
    permissions:
      contents: read
    runs-on: [self-hosted, linux, x64, mizan]
    needs: [billing, lint, test, typecheck, ruh, bayan, frontend, own-research, provenance]
    if: ${{ !cancelled() && !failure() && needs.billing.outputs.build == 'true' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Fresh Python environment
        run: python -m venv --clear "$RUNNER_TEMP/venv" && echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
      - run: pip install "build>=1.6.1,<2"
      - run: python -m build
      - name: Keep the package on the runner
        run: bash scripts/ci/keep-results.sh dist dist

  # Typecheck runs on every run, pull requests included.
  typecheck:
    runs-on: [self-hosted, linux, x64, mizan]
    needs: billing
    if: needs.billing.outputs.verified != 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Fresh Python environment
        run: python -m venv --clear "$RUNNER_TEMP/venv" && echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
      - run: pip install -e ".[dev,nlp,knowledge]"
      - run: PYTHONPATH=backend:. mypy backend/

  ruh:
    runs-on: [self-hosted, linux, x64, mizan]
    needs: billing
    if: needs.billing.outputs.ruh == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Fresh Python environment
        run: python -m venv --clear "$RUNNER_TEMP/venv" && echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
      - run: pip install --index-url https://download.pytorch.org/whl/cpu "torch==2.14.1+cpu"
      - run: pip install -e ".[dev,nlp,knowledge]" datasets
      - run: PYTHONPATH=backend:. pytest ruh_model/tests/ -q

  bayan:
    runs-on: [self-hosted, linux, x64, mizan]
    needs: billing
    if: needs.billing.outputs.bayan == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Fresh Python environment
        run: python -m venv --clear "$RUNNER_TEMP/venv" && echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
      # The vendored copy must match ruh_model/tokenizer/ (writes nothing).
      - run: python packages/bayan/scripts/sync_vendor.py --check
      - run: pip install pytest
      - run: PYTHONPATH=packages/bayan/src python -m pytest --noconftest --import-mode=importlib packages/bayan/tests -q

  frontend:
    # Named as the job of the removed pr-check.yml was, for a branch protection rule.
    name: ${{ github.event_name == 'pull_request' && 'Frontend Build' || 'frontend' }}
    permissions:
      contents: read
    runs-on: [self-hosted, linux, x64, mizan]
    needs: billing
    if: needs.billing.outputs.verified != 'true'
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
        with:
          # Vitest compares a pull request with its merge commit's first parent.
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 1 }}
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
        if: needs.billing.outputs.lint == 'true'
      - run: npm test
        if: needs.billing.outputs.vitest == 'all'
      # The specs whose imports reach the change; none reached is a pass.
      - run: npm test -- --changed HEAD^1 --passWithNoTests
        if: needs.billing.outputs.vitest == 'changed'
      - run: npm run test:utils
        if: needs.billing.outputs.utils == 'true'
      # The build, its size budget and the browser tests are heavy: on main when the merge changed
      # the frontend, weekly and by hand, after this job's own checks pass.
      - run: npm run build
        if: needs.billing.outputs.frontend_build == 'true'
      - run: npm run size
        if: needs.billing.outputs.frontend_build == 'true'
      # Chromium's system libraries are in the runner image; the browser itself is kept in the
      # runner's cache (~/.cache/ms-playwright) between runs.
      - name: Browser tests (mocked API, desktop and phone)
        if: needs.billing.outputs.frontend_build == 'true'
        run: npx playwright install chromium && npm run e2e
      - name: Keep failed browser reports on the runner
        if: failure()
        working-directory: .
        run: bash scripts/ci/keep-results.sh playwright-report --optional --base frontend playwright-report test-results

  provenance:
    name: Docker provenance preflight
    runs-on: [self-hosted, linux, x64, mizan]
    needs: billing
    # Every push that builds production images, weekly and by hand: it gates the images.
    if: needs.billing.outputs.provenance == 'true'
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - name: Set up attestation-capable builder
        id: buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver: docker-container
          cache-binary: false
      - name: Verify actual OCI provenance export
        env:
          BUILDX_BUILDER: ${{ steps.buildx.outputs.name }}
        run: python3 scripts/verify_build_provenance.py

  docker:
    name: Docker build
    runs-on: [self-hosted, linux, x64, mizan]
    needs: [billing, lint, test, typecheck, ruh, bayan, frontend, own-research, provenance]
    if: ${{ !cancelled() && !failure() && needs.billing.outputs.docker == 'true' }}
    steps:
      - uses: actions/checkout@v7
      - name: Build backend image
        run: docker build -f docker/Dockerfile.backend.prod -t mizan-backend .
      - name: Verify production runtime dependencies
        run: >-
          docker run --rm --entrypoint python mizan-backend
          -c "import torch, fastapi, openai, anthropic, PIL;
          from ruh_model.tokenizer.bayan import BayanTokenizer;
          from mizan_owned.learning_cycle import _implementation;
          from mizan_owned.learning_service import worker_environment;
          from importlib.metadata import version;
          assert torch.version.cuda is None;
          assert version('pip') == '26.2.1';
          assert version('setuptools') == '84.0.0';
          assert len(_implementation()) == 12;
          assert worker_environment()['PYTHONPATH'] == '/app';
          assert BayanTokenizer().encode('knowledge')"
      - name: Build frontend image
        run: docker build -f docker/Dockerfile.frontend.prod -t mizan-frontend ./frontend
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Fresh Python environment
        run: python -m venv --clear "$RUNNER_TEMP/venv" && echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
      - name: Build isolated coding images
        run: |
          bash scripts/build_workspace_image.sh workspace-runtime mizan-workspace-runtime:v1 --load
          bash scripts/build_workspace_image.sh workspace-runner mizan-workspace-runner:v1 --load
      - name: Verify the isolated runner and actual code execution
        env:
          MIZAN_DATA_DIR: ${{ runner.temp }}/isolated-coding-tests
          DB_PATH: ${{ runner.temp }}/isolated-coding-tests/memory.db
        run: |
          python -m pip install -e '.[dev,nlp]'
          mkdir -p "$MIZAN_DATA_DIR"
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges mizan-workspace-runner:v1 /bin/sh -c 'docker --version && python -c "from workspace.runner import app; assert app.docs_url is None"'
          pytest tests/test_coding_workspace.py tests/test_artifacts.py -q

  browser:
    name: Browser sandbox (Shahid)
    runs-on: [self-hosted, linux, x64, mizan]
    needs: [billing, lint, test, typecheck, ruh, bayan, frontend, own-research]
    if: ${{ !cancelled() && !failure() && needs.billing.outputs.browser == 'true' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Build the browser sandbox image
        run: bash scripts/build_workspace_image.sh workspace-browser mizan-workspace-browser:v1 --load
      - name: A real browser follows Shahid's rules inside the hardened container
        run: >-
          docker run --rm --network none --read-only --cap-drop ALL
          --security-opt no-new-privileges --user 65534:65534 --shm-size 256m
          --tmpfs /tmp:rw,nosuid,nodev,size=256m,mode=1777 --env HOME=/tmp
          mizan-workspace-browser:v1 python3 -I /browse_selftest.py
      - name: The browse egress proxy starts in public mode
        run: >-
          docker run --rm --network none --read-only --cap-drop ALL
          --security-opt no-new-privileges --env MIZAN_EGRESS_MODE=public
          mizan-workspace-browser:v1 python3 -I -c
          "import sys; sys.path.insert(0, '/'); import egress_proxy as e;
          assert e.public_mode() and e.host_allowed('example.org', e.allowlist())"

  # Deploy Production sends these images from this runner's Docker to the server over SSH
  # (docs/deployment.md): no registry, no GitHub Packages. They keep the ghcr.io/... names the
  # server's deploy state and workspace-runner installer already record, but are never pushed.
  production-images:
    name: Keep production images on the runner
    # Every push to main, as before: Deploy Production sends this commit's images. It waits for
    # every check of this run; one the plan skipped (files that passed a full run before, or a
    # heavy job the merge did not reach) does not hold it back, and one that failed does.
    if: ${{ !cancelled() && !failure() && github.event_name == 'push' }}
    runs-on: [self-hosted, linux, x64, mizan]
    needs: [billing, lint, test, typecheck, ruh, bayan, frontend, own-research, provenance, build, docker, browser]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Production backend
        run: docker build -f docker/Dockerfile.backend.prod -t "ghcr.io/${GITHUB_REPOSITORY,,}/backend:$GITHUB_SHA" .
      - name: Production frontend
        run: docker build -f docker/Dockerfile.frontend.prod -t "ghcr.io/${GITHUB_REPOSITORY,,}/frontend:$GITHUB_SHA" ./frontend
      - name: Isolated workspace runtime
        run: bash scripts/build_workspace_image.sh workspace-runtime "ghcr.io/${GITHUB_REPOSITORY,,}/workspace-runtime:$GITHUB_SHA" --load
      - name: Private workspace runner
        run: bash scripts/build_workspace_image.sh workspace-runner "ghcr.io/${GITHUB_REPOSITORY,,}/workspace-runner:$GITHUB_SHA" --load
      - name: The browser sandbox (Shahid)
        run: bash scripts/build_workspace_image.sh workspace-browser "ghcr.io/${GITHUB_REPOSITORY,,}/workspace-browser:$GITHUB_SHA" --load
      # A deploy sends only the newest commit on its branch, so older commits' images are dropped.
      # The server keeps the images it runs and the ones a rollback needs.
      - name: Drop earlier commits' production images
        run: |
          set -euo pipefail
          names="^ghcr\.io/${GITHUB_REPOSITORY,,}/(backend|frontend|workspace-(runtime|runner|browser)):[0-9a-f]{40}\$"
          mapfile -t earlier < <(docker image ls --format '{{.Repository}}:{{.Tag}}' |
            grep -E "$names" | grep -v ":$GITHUB_SHA\$" || true)
          if ((${#earlier[@]})); then docker image rm "${earlier[@]}" >/dev/null || true; fi
          docker image prune --force >/dev/null
