name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check backend/ nlp/ tests/
      - run: ruff format --check backend/ nlp/ tests/

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: pip install -e ".[dev,nlp,knowledge]"
      - name: Run tests
        run: pytest tests/ -v --tb=short --cov=backend --cov-report=xml
      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v4
        with:
          file: coverage.xml

  build:
    name: Build package
    runs-on: ubuntu-24.04
    needs: [lint, test, typecheck, ruh, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  typecheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,nlp,knowledge]"
      - run: PYTHONPATH=backend:. mypy backend/

  ruh:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e ".[dev,nlp,knowledge]" datasets
      - run: PYTHONPATH=backend:. pytest ruh_model/tests/ -q

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: for test in src/utils/*.test.ts; do node "$test" || exit; done
      - run: npm run build

  docker:
    name: Docker build
    runs-on: ubuntu-24.04
    needs: [lint, test, typecheck, ruh, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -f docker/Dockerfile.backend.prod -t mizan-backend .
      - name: Verify production runtime dependencies
        run: >-
          docker run --rm --entrypoint python mizan-backend
          -c "import torch, fastapi, openai, anthropic, PIL;
          from ruh_model.tokenizer.bayan import BayanTokenizer;
          from importlib.metadata import version;
          assert torch.version.cuda is None;
          assert version('pip') == '26.2.1';
          assert version('setuptools') == '84.0.0';
          assert BayanTokenizer().encode('knowledge')"
      - name: Build frontend image
        run: docker build -f docker/Dockerfile.frontend.prod -t mizan-frontend ./frontend
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build isolated coding images
        run: |
          docker build --build-arg BASE_REGISTRY=mirror.gcr.io/library -f docker/Dockerfile.workspace-runtime -t mizan-workspace-runtime:v1 .
          docker build --build-arg BASE_REGISTRY=mirror.gcr.io/library -f docker/Dockerfile.workspace-runner -t mizan-workspace-runner:v1 .
      - name: Verify the isolated runner and actual code execution
        env:
          MIZAN_DATA_DIR: ${{ runner.temp }}/isolated-coding-tests
          DB_PATH: ${{ runner.temp }}/isolated-coding-tests/memory.db
        run: |
          python -m pip install -e '.[dev,nlp]'
          mkdir -p "$MIZAN_DATA_DIR"
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges mizan-workspace-runner:v1 /bin/sh -c 'docker --version && python -c "from workspace.runner import app; assert app.docs_url is None"'
          pytest tests/test_coding_workspace.py tests/test_artifacts.py -q

  publish-production:
    name: Publish production images
    if: github.event_name == 'push' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    needs: [build, docker]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: repository
        run: echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Publish production backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.backend.prod
          push: true
          tags: ghcr.io/${{ steps.repository.outputs.name }}/backend:${{ github.sha }}
      - name: Publish production frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: docker/Dockerfile.frontend.prod
          push: true
          tags: ghcr.io/${{ steps.repository.outputs.name }}/frontend:${{ github.sha }}
      - name: Publish isolated workspace runtime
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.workspace-runtime
          build-args: BASE_REGISTRY=mirror.gcr.io/library
          push: true
          tags: ghcr.io/${{ steps.repository.outputs.name }}/workspace-runtime:${{ github.sha }}
      - name: Publish private workspace runner
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.workspace-runner
          build-args: BASE_REGISTRY=mirror.gcr.io/library
          push: true
          tags: ghcr.io/${{ steps.repository.outputs.name }}/workspace-runner:${{ github.sha }}
