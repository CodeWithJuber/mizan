name: Docs

# Checks the documentation on the self-hosted runner. It no longer deploys to GitHub Pages:
# Pages on a private repository needs a paid plan, and its upload uses artifact storage
# (docs/ci-artifacts.md). docs/ is read in the repository itself.

on:
  push:
    branches: [main, master]
    paths:
      - "docs/**"
      - "CHANGELOG.md"
      - "README.md"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build docs
    runs-on: [self-hosted, linux, x64, mizan]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate documentation files
        run: |
          test -s docs/index.html
          test -s docs/nlp.md
          test -s docs/TRAINING.md
          python3 -c 'from html.parser import HTMLParser; from pathlib import Path; HTMLParser().feed(Path("docs/index.html").read_text())'
