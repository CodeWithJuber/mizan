name: Docs

# Checks the documentation. It does not deploy to GitHub Pages: docs/ is read in the repository
# itself (docs/ci-artifacts.md).

on:
  push:
    branches: [main, master]
    paths:
      - "docs/**"
      - "CHANGELOG.md"
      - "README.md"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build docs
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate documentation files
        run: |
          test -s docs/index.html
          test -s docs/nlp.md
          test -s docs/TRAINING.md
          python3 -c 'from html.parser import HTMLParser; from pathlib import Path; HTMLParser().feed(Path("docs/index.html").read_text())'
