name: Move CI outputs to compute
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
permissions:
  contents: read
  actions: write
concurrency:
  group: mizan-ci-storage-${{ github.event.workflow_run.id }}
  cancel-in-progress: false
jobs:
  archive:
    if: >-
      github.repository == 'CodeWithJuber/mizan' &&
      github.event.workflow_run.repository.full_name == github.repository &&
      github.event.workflow_run.path == '.github/workflows/ci.yml'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out default-branch archive code and host key
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            deploy/known_hosts
            scripts/archive_ci_outputs.sh
            scripts/store_actions_archive.sh
          sparse-checkout-cone-mode: false
      - name: Install SSH client
        run: command -v sshpass >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq sshpass)
      - name: Verify the triggering run's outputs on compute
        env:
          CI_RUN_ID: ${{ github.event.workflow_run.id }}
          GH_TOKEN: ${{ github.token }}
          SSH_HOST: ${{ secrets.SSH_COMPUTING_HOST || vars.SSH_COMPUTING_HOST }}
          SSH_USER: ${{ secrets.SSH_COMPUTING_HOST_USER || vars.SSH_COMPUTING_HOST_USER }}
          SSHPASS: ${{ secrets.SSH_COMPUTING_HOST_PASSWORD }}
        run: bash scripts/archive_ci_outputs.sh
